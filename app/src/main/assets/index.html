<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nokia Launcher — Prototipo 1:1 en Español</title>
  <style>
    :root {
      --body-bg: #0c0d0f;
      --key-hover: rgba(255, 255, 255, 0.06);
      --key-active: rgba(255, 255, 255, 0.14);
      --key-text: #f3f4f6;
      --key-sub: #a1a1aa;
      --dpad-ring: #d4d4d8;

      --lcd-bg: #b5a828;
      --lcd-bg-dark: #a39720;
      --lcd-ink: #11110d;
      --lcd-highlight-bg: #11110d;
      --lcd-highlight-ink: #c7ba30;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050506;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--key-text);
      overflow: hidden;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* Ajuste universal a pantalla completa en cualquier Android (Samsung Galaxy A15, 19.5:9, 20:9, 16:9) */
    .phone {
      width: 100%;
      height: 100%;
      background: var(--body-bg);
      display: flex;
      flex-direction: column;
      padding: 44px 12px 18px 12px;
      position: relative;
      transition: background 0.22s ease;
    }

    @media (min-width: 520px) {
      .stage {
        padding: 14px;
      }
      .phone {
        width: min(390px, 100%);
        height: min(800px, calc(100% - 28px));
        border-radius: 34px;
        padding: 22px 14px 18px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    /* Temas de carcasa */
    .phone[data-body="black"] {
      --body-bg: #0c0d0f;
      --key-text: #f3f4f6;
      --key-sub: #a1a1aa;
      --dpad-ring: #d4d4d8;
    }

    .phone[data-body="cyan"] {
      --body-bg: #15a8df;
      --key-text: #063b52;
      --key-sub: #0b5575;
      --dpad-ring: #0a4e6b;
    }

    .phone[data-body="silver"] {
      --body-bg: #4b5563;
      --key-text: #f9fafb;
      --key-sub: #d1d5db;
      --dpad-ring: #e5e7eb;
    }

    .phone[data-body="red"] {
      --body-bg: #991b1b;
      --key-text: #fff5f5;
      --key-sub: #fecaca;
      --dpad-ring: #fee2e2;
    }

    /* Temas de pantalla LCD */
    .phone[data-lcd="yellow"] {
      --lcd-bg: #b5a828;
      --lcd-bg-dark: #a39720;
      --lcd-ink: #11110d;
      --lcd-highlight-bg: #11110d;
      --lcd-highlight-ink: #c7ba30;
    }

    .phone[data-lcd="green"] {
      --lcd-bg: #8baa68;
      --lcd-bg-dark: #7a9858;
      --lcd-ink: #14200c;
      --lcd-highlight-bg: #14200c;
      --lcd-highlight-ink: #9cbc76;
    }

    .phone[data-lcd="blue"] {
      --lcd-bg: #7ab6d6;
      --lcd-bg-dark: #66a3c4;
      --lcd-ink: #0a1c29;
      --lcd-highlight-bg: #0a1c29;
      --lcd-highlight-ink: #9ad1ee;
    }

    .phone[data-lcd="oled"] {
      --lcd-bg: #111317;
      --lcd-bg-dark: #1a1d24;
      --lcd-ink: #f3f4f6;
      --lcd-highlight-bg: #f3f4f6;
      --lcd-highlight-ink: #111317;
    }

    .brand {
      text-align: center;
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: var(--key-text);
      margin-bottom: 14px;
      font-family: "Arial Black", "Inter", sans-serif;
      opacity: 0.92;
      flex-shrink: 0;
    }

    /* Pantalla LCD proporcional para cualquier resolución Android */
    .lcd {
      flex: 0 0 46%;
      height: 46%;
      min-height: 220px;
      background: var(--lcd-bg);
      color: var(--lcd-ink);
      border-radius: 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.35);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .lcd-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 2px;
      height: 22px;
      z-index: 6;
      flex-shrink: 0;
    }

    .lcd-status.dark-status {
      background: #14151a;
      color: #f3f4f6;
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lcd-body {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 5;
    }

    /* Pantalla de inicio */
    .home-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 0 2px;
      position: relative;
    }

    .home-date {
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      margin-top: 38px;
      letter-spacing: 0.02em;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .home-clock-strip {
      position: relative;
      width: 100%;
      height: 44px;
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .home-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      height: 1.5px;
      background: var(--lcd-ink);
    }

    .home-clock-ribbon {
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
      padding: 4px 10px 4px 22px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%);
      position: relative;
      z-index: 2;
      margin-bottom: 6px;
      font-family: "Courier New", Courier, monospace;
    }

    /* Marcador */
    .dialer-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 8px 10px 6px;
      text-align: right;
    }

    .dialer-number {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.04em;
      word-break: break-all;
      line-height: 1.1;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    /* Llamada */
    .calling-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .calling-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--lcd-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      animation: pulseRing 1.2s infinite ease-in-out;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(0.94); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* Listas (Ir a / Personalizar) */
    .list-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 0 4px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .list-header {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 0 8px;
    }

    .list-item {
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-item.selected {
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
    }

    .list-item-val {
      font-size: 11px;
      opacity: 0.85;
    }

    /* Cajón de apps (Menú) — animación 1:1 del video: entrada zoom-out dramática y salida zoom-in */
    .home-view {
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s ease;
    }

    .home-view.dimmed {
      transform: scale(0.92);
      opacity: 0.45;
    }

    .menu-overlay {
      position: absolute;
      inset: 0;
      background: rgba(12, 14, 18, 0.72);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      overflow: hidden;
      z-index: 15;
      will-change: opacity;
    }

    .menu-scroll {
      transform-origin: center center;
      will-change: transform, opacity, filter;
    }

    .menu-overlay.entering {
      animation: menuBackdropIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .menu-overlay.entering .menu-scroll {
      animation: menuZoomEnter 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .menu-overlay.closing {
      animation: menuBackdropOut 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      pointer-events: none;
    }

    .menu-overlay.closing .menu-scroll {
      animation: menuZoomExit 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes menuBackdropIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes menuBackdropOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    @keyframes menuZoomEnter {
      0% {
        opacity: 0;
        transform: scale(2.85) translateZ(0);
        filter: blur(5px);
      }
      55% {
        opacity: 0.95;
        filter: blur(0.5px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateZ(0);
        filter: blur(0px);
      }
    }

    @keyframes menuZoomExit {
      0% {
        opacity: 1;
        transform: scale(1) translateZ(0);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: scale(2.85) translateZ(0);
        filter: blur(5px);
      }
    }

    .menu-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 10px 8px 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 6px;
      align-content: start;
    }

    .menu-scroll::-webkit-scrollbar {
      width: 3px;
    }

    .menu-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
    }

    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 3px 2px;
      border-radius: 10px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform 0.08s ease, background 0.12s ease;
    }

    .app-tile.selected {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(250, 204, 21, 0.9);
    }

    .app-tile:active {
      transform: scale(0.92);
    }

    .app-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .app-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    }

    .app-name {
      font-size: 9px;
      font-weight: 500;
      color: #e5e7eb;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .menu-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 4px 0 6px;
    }

    .menu-dots button {
      width: 5px;
      height: 5px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .menu-dots button.active {
      background: #ffffff;
      transform: scale(1.25);
    }

    /* Snake */
    .snake-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2px 6px 4px;
      overflow: hidden;
    }

    .snake-hud {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 900;
      padding-bottom: 3px;
      border-bottom: 1.5px solid var(--lcd-ink);
      margin-bottom: 4px;
    }

    .snake-canvas-wrap {
      flex: 1;
      position: relative;
      border: 2px solid var(--lcd-ink);
      background: var(--lcd-bg-dark);
      overflow: hidden;
    }

    #snakeCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .snake-overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 13, 0.86);
      color: var(--lcd-highlight-ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    /* Calculadora */
    .mini-app-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 4px 8px;
      gap: 6px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .calc-display {
      border: 1.5px solid var(--lcd-ink);
      padding: 8px;
      text-align: right;
      font-size: 20px;
      font-weight: 900;
      background: var(--lcd-bg-dark);
      border-radius: 4px;
      min-height: 40px;
      font-family: "Courier New", Courier, monospace;
    }

    .calc-ops {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .lcd-mini-btn {
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
      border: none;
      border-radius: 3px;
      padding: 6px 4px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Barra de teclas suaves */
    .lcd-softkeys {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 3px 8px 5px;
      font-size: 12px;
      font-weight: 700;
      z-index: 6;
      flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .lcd-softkeys.hidden {
      display: none;
    }

    .soft-left { text-align: left; }
    .soft-center { text-align: center; }
    .soft-right { text-align: right; }

    /* Aviso interno */
    .lcd-toast {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 28px;
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      z-index: 30;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .lcd-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Teclado negro mate continuo adaptable a cualquier altura */
    .keypad {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 4px 4px;
      gap: 6px;
    }

    .nav-cluster {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      gap: 10px;
      align-items: center;
    }

    .nav-side {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .key {
      background: transparent;
      color: var(--key-text);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.08s ease, transform 0.06s ease;
      font-family: inherit;
    }

    @media (hover: hover) {
      .key:hover {
        background: var(--key-hover);
      }
    }

    .key:active, .key.pressed {
      background: var(--key-active);
      transform: scale(0.95);
    }

    .key-soft {
      height: 38px;
    }

    .soft-dash {
      width: 24px;
      height: 2.2px;
      background: var(--key-text);
      border-radius: 2px;
      opacity: 0.92;
    }

    .key-call {
      height: 38px;
      color: #22c55e;
    }

    .key-end {
      height: 38px;
      color: #ef4444;
    }

    /* Cruceta cuadrada minimalista igual al video */
    .dpad {
      height: 78px;
      width: 78px;
      margin: 0 auto;
      background: transparent;
      border: 2.2px solid var(--dpad-ring);
      border-radius: 18px;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1.25fr 1fr;
      grid-template-rows: 1fr 1.25fr 1fr;
      overflow: hidden;
    }

    .dpad-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.08s ease;
    }

    .dpad-btn:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-ok { grid-column: 2; grid-row: 2; border-radius: 8px; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    /* Cuadrícula T9 continua */
    .t9-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 10px;
      flex: 1;
      align-items: center;
    }

    .key-num {
      height: 100%;
      min-height: 0;
      gap: 6px;
      align-items: center;
      padding: 2px 0;
    }

    .key-digit {
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }

    .key-letters {
      font-size: 9.5px;
      color: var(--key-sub);
      font-weight: 500;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phoneShell" data-body="black" data-lcd="yellow">
      <div class="brand">NOKIA</div>

      <div class="lcd" id="lcdScreen">
        <div class="lcd-status" id="lcdStatus">
          <div class="status-left">
            <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-label="Señal">
              <path d="M1 1H7L4 5V11M4 1V5" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/>
              <rect x="9" y="8" width="2.2" height="3.2" fill="currentColor"/>
              <rect x="12.5" y="6" width="2.2" height="5.2" fill="currentColor"/>
              <rect x="16" y="3.8" width="2.2" height="7.4" fill="currentColor"/>
              <rect x="19.5" y="1.5" width="2.2" height="9.7" fill="currentColor"/>
            </svg>
          </div>
          <div class="status-right">
            <svg width="14" height="11" viewBox="0 0 16 12" fill="none" aria-label="Wi-Fi">
              <path d="M1.2 4C5 0.6 11 0.6 14.8 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M3.9 6.9C6.2 4.8 9.8 4.8 12.1 6.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor"/>
            </svg>
            <svg width="20" height="11" viewBox="0 0 22 11" fill="none" aria-label="Batería">
              <rect x="1" y="1.2" width="17.5" height="8.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/>
              <rect x="19.2" y="3.5" width="1.8" height="4" rx="0.5" fill="currentColor"/>
              <rect x="3" y="3" width="3.5" height="5" fill="currentColor"/>
              <rect x="7.8" y="3" width="3.5" height="5" fill="currentColor"/>
              <rect x="12.6" y="3" width="3.5" height="5" fill="currentColor"/>
            </svg>
          </div>
        </div>

        <div class="lcd-body" id="lcdBody"></div>

        <div class="lcd-softkeys" id="lcdSoftkeys">
          <span class="soft-left" id="softLeftLabel">Ir a</span>
          <span class="soft-center" id="softCenterLabel">Menú</span>
          <span class="soft-right" id="softRightLabel">Ajustes</span>
        </div>

        <div class="lcd-toast" id="lcdToast"></div>
      </div>

      <div class="keypad">
        <div class="nav-cluster">
          <div class="nav-side">
            <button class="key key-soft" data-action="soft-left" aria-label="Ir a"><span class="soft-dash"></span></button>
            <button class="key key-call" data-action="call" aria-label="Llamar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">

  <script>
    (function () {
      const BODY_THEMES = [
        { id: "black", name: "Negro" },
        { id: "cyan", name: "Azul Cian" },
        { id: "silver", name: "Gris Titanio" },
        { id: "red", name: "Rojo Clásico" }
      ];

      const LCD_THEMES = [
        { id: "yellow", name: "Amarillo Clásico" },
        { id: "green", name: "Verde 3310" },
        { id: "blue", name: "Azul Retro" },
        { id: "oled", name: "Oscuro OLED" }
      ];

      const APP_PAGES = [
        [
          { id: "whatsapp", name: "WhatsApp", emoji: "💬", bg: "linear-gradient(135deg,#25d366,#128c7e)" },
          { id: "tiktok", name: "TikTok", emoji: "🎵", bg: "#111827" },
          { id: "youtube", name: "YouTube", emoji: "▶", bg: "#dc2626" },
          { id: "instagram", name: "Instagram", emoji: "📸", bg: "linear-gradient(135deg,#f59e0b,#ec4899,#8b5cf6)" },
          { id: "camera", name: "Cámara", emoji: "📷", bg: "#2563eb" },
          { id: "browser", name: "Internet", emoji: "🌐", bg: "#0284c7" },
          { id: "snake", name: "Snake", emoji: "🐍", bg: "#65a30d" },
          { id: "calc", name: "Calculadora", emoji: "🧮", bg: "#d97706" },
          { id: "gallery", name: "Galería", emoji: "🖼️", bg: "#db2777" },
          { id: "music", name: "Música", emoji: "🎧", bg: "#7c3aed" },
          { id: "clock", name: "Reloj", emoji: "⏰", bg: "#0d9488" },
          { id: "settings", name: "Ajustes", emoji: "⚙️", bg: "#475569" }
        ],
        [
          { id: "facebook", name: "Facebook", emoji: "f", bg: "#1d4ed8" },
          { id: "maps", name: "Mapas", emoji: "📍", bg: "#16a34a" },
          { id: "gmail", name: "Gmail", emoji: "✉️", bg: "#ef4444" },
          { id: "drive", name: "Drive", emoji: "▲", bg: "#2563eb" },
          { id: "calendar", name: "Calendario", emoji: "📅", bg: "#0ea5e9" },
          { id: "notes", name: "Notas", emoji: "📝", bg: "#eab308" },
          { id: "files", name: "Archivos", emoji: "📁", bg: "#f97316" },
          { id: "play", name: "Play Store", emoji: "▶", bg: "#059669" },
          { id: "weather", name: "Clima", emoji: "⛅", bg: "#38bdf8" },
          { id: "contacts", name: "Contactos", emoji: "👤", bg: "#0284c7" },
          { id: "radio", name: "Radio FM", emoji: "📻", bg: "#6366f1" },
          { id: "torch", name: "Linterna", emoji: "🔦", bg: "#334155" }
        ]
      ];

      const GOTO_ITEMS = [
        { id: "browser", label: "Internet" },
        { id: "camera", label: "Cámara" },
        { id: "snake", label: "Juego Snake Clásico" },
        { id: "customize", label: "Personalizar Launcher" },
        { id: "exit", label: "Salir del Launcher" }
      ];

      let REAL_ANDROID_APPS = null;

      function loadRealAndroidApps() {
        if (window.AndroidLauncher && typeof window.AndroidLauncher.getInstalledApps === "function") {
          try {
            const parsed = JSON.parse(window.AndroidLauncher.getInstalledApps() || "[]");
            if (Array.isArray(parsed) && parsed.length > 0) {
              REAL_ANDROID_APPS = parsed;
            }
          } catch (e) {}
        }
      }

      function getActiveAppList() {
        if (REAL_ANDROID_APPS && REAL_ANDROID_APPS.length > 0) return REAL_ANDROID_APPS;
        return APP_PAGES.flat();
      }

      window.onAndroidBack = function () {
        if (state.view === "menu") goHome(true);
        else if (state.view !== "home") goHome(false);
      };

      window.onAndroidResume = function () {
        loadRealAndroidApps();
        if (state.view === "home") render();
      };

      const state = {
        view: "home",
        dialNumber: "",
        gotoIndex: 0,
        menuPage: 0,
        menuIndex: 0,
        menuAnimateIn: false,
        menuClosing: false,
        customizeIndex: 0,
        bodyIdx: 0,
        lcdIdx: 0,
        soundOn: true,
        use24h: false,
        activeApp: null,
        callSeconds: 0,
        callTimer: null,
        calcValue: "0",
        calcPrev: null,
        calcOp: null,
        calcReset: false,
        snakeHigh: 0
      };

      try {
        const saved = JSON.parse(localStorage.getItem("nokia_1to1_es_prefs") || "{}");
        if (typeof saved.bodyIdx === "number") state.bodyIdx = saved.bodyIdx % BODY_THEMES.length;
        if (typeof saved.lcdIdx === "number") state.lcdIdx = saved.lcdIdx % LCD_THEMES.length;
        if (typeof saved.soundOn === "boolean") state.soundOn = saved.soundOn;
        if (typeof saved.snakeHigh === "number") state.snakeHigh = saved.snakeHigh;
      } catch (e) {}

      function savePrefs() {
        try {
          localStorage.setItem("nokia_1to1_es_prefs", JSON.stringify({
            bodyIdx: state.bodyIdx,
            lcdIdx: state.lcdIdx,
            soundOn: state.soundOn,
            snakeHigh: state.snakeHigh
          }));
        } catch (e) {}
      }

      /* =====================================================================
         DOS SONIDOS EXACTOS MEDIDOS DEL AUDIO DEL VIDEO DE REFERENCIA:
         1) Teclas numéricas (0-9, *, #): Tono dual DTMF senoidal puro (~95ms)
            medido en 1.20s, 1.60s, 2.10s, 2.66s del video (pares ITU exactos).
         2) Teclas de navegación y menú (cruceta, Ir a, Menú, Ajustes, Colgar):
            Bleep corto clásico Nokia a 933 Hz constante (~45ms, suave armónico
            a 1866 Hz), medido en 4.56s, 7.56s, 8.13s, 10.55s y 11.12s.
      ===================================================================== */
      let audioCtx = null;
      const DTMF_FREQS = {
        "1": [697, 1209], "2": [697, 1336], "3": [697, 1477],
        "4": [770, 1209], "5": [770, 1336], "6": [770, 1477],
        "7": [852, 1209], "8": [852, 1336], "9": [852, 1477],
        "*": [941, 1209], "0": [941, 1336], "#": [941, 1477]
      };

      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
      }

      // Sonido 1: Tono DTMF dual exacto del teclado numérico del video
      function playDtmfSound(digit) {
        if (!state.soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        const pair = DTMF_FREQS[digit] || [697, 1209];
        const now = audioCtx.currentTime;
        const dur = 0.095;

        pair.forEach((freq) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.075, now + 0.005);
          gain.gain.setValueAtTime(0.075, now + dur - 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.005);
        });
      }

      // Sonido 2: Bleep clásico Nokia de 933 Hz exacto del video para navegación/menú
      function playNavBeepSound(freq = 933) {
        if (!state.soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const dur = 0.046;

        const oscMain = audioCtx.createOscillator();
        const oscHarm = audioCtx.createOscillator();
        const gainMain = audioCtx.createGain();
        const gainHarm = audioCtx.createGain();

        oscMain.type = "sine";
        oscMain.frequency.setValueAtTime(freq, now);
        oscHarm.type = "sine";
        oscHarm.frequency.setValueAtTime(freq * 2, now);

        gainMain.gain.setValueAtTime(0.001, now);
        gainMain.gain.linearRampToValueAtTime(0.07, now + 0.004);
        gainMain.gain.setValueAtTime(0.07, now + dur - 0.01);
        gainMain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        gainHarm.gain.setValueAtTime(0.001, now);
        gainHarm.gain.linearRampToValueAtTime(0.014, now + 0.004);
        gainHarm.gain.exponentialRampToValueAtTime(0.001, now + dur);

        oscMain.connect(gainMain);
        oscHarm.connect(gainHarm);
        gainMain.connect(audioCtx.destination);
        gainHarm.connect(audioCtx.destination);

        oscMain.start(now);
        oscHarm.start(now);
        oscMain.stop(now + dur + 0.005);
        oscHarm.stop(now + dur + 0.005);
      }

      function vibrate(ms = 12) {
        if (window.AndroidLauncher && typeof window.AndroidLauncher.vibrate === "function") {
          try { window.AndroidLauncher.vibrate(ms); return; } catch (e) {}
        }
        if (navigator.vibrate) {
          try { navigator.vibrate(ms); } catch (e) {}
        }
      }

      const phoneShell = document.getElementById("phoneShell");
      const lcdStatus = document.getElementById("lcdStatus");
      const lcdBody = document.getElementById("lcdBody");
      const lcdSoftkeys = document.getElementById("lcdSoftkeys");
      const softLeftLabel = document.getElementById("softLeftLabel");
      const softCenterLabel = document.getElementById("softCenterLabel");
      const softRightLabel = document.getElementById("softRightLabel");
      const lcdToast = document.getElementById("lcdToast");

      let toastTimer = null;
      function showToast(msg) {
        lcdToast.textContent = msg;
        lcdToast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => lcdToast.classList.remove("show"), 1800);
      }

      function applyThemes() {
        phoneShell.setAttribute("data-body", BODY_THEMES[state.bodyIdx].id);
        phoneShell.setAttribute("data-lcd", LCD_THEMES[state.lcdIdx].id);
      }

      function formatClock4Digits() {
        const now = new Date();
        const rawH = now.getHours();
        const m = String(now.getMinutes()).padStart(2, "0");
        if (state.use24h) {
          return `${String(rawH).padStart(2, "0")}:${m}`;
        }
        const period = rawH >= 12 ? "pm" : "am";
        const h12 = rawH % 12 || 12;
        return `${String(h12).padStart(2, "0")}:${m} ${period}`;
      }

      function formatDate() {
        const now = new Date();
        const days = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
        const months = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
        return `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
      }

      function setSoftkeys(left, center, right, hideBar = false) {
        softLeftLabel.textContent = left;
        softCenterLabel.textContent = center;
        softRightLabel.textContent = right;
        lcdSoftkeys.classList.toggle("hidden", hideBar);
      }

      // Snake
      const snake = {
        timer: null,
        cols: 20,
        rows: 13,
        body: [],
        dir: { x: 1, y: 0 },
        nextDir: { x: 1, y: 0 },
        food: { x: 12, y: 6 },
        score: 0,
        running: false,
        gameOver: false
      };

      function stopSnake() {
        if (snake.timer) {
          clearInterval(snake.timer);
          snake.timer = null;
        }
        snake.running = false;
      }

      function startSnake() {
        stopSnake();
        snake.body = [{ x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 }];
        snake.dir = { x: 1, y: 0 };
        snake.nextDir = { x: 1, y: 0 };
        snake.score = 0;
        snake.gameOver = false;
        snake.running = true;
        spawnFood();
        render();
        snake.timer = setInterval(tickSnake, 145);
      }

      function spawnFood() {
        let tries = 0;
        while (tries < 200) {
          const fx = Math.floor(Math.random() * snake.cols);
          const fy = Math.floor(Math.random() * snake.rows);
          if (!snake.body.some((s) => s.x === fx && s.y === fy)) {
            snake.food = { x: fx, y: fy };
            return;
          }
          tries++;
        }
      }

      function tickSnake() {
        if (!snake.running || state.view !== "snake") return;
        snake.dir = snake.nextDir;
        const head = {
          x: (snake.body[0].x + snake.dir.x + snake.cols) % snake.cols,
          y: (snake.body[0].y + snake.dir.y + snake.rows) % snake.rows
        };
        if (snake.body.some((seg) => seg.x === head.x && seg.y === head.y)) {
          snake.gameOver = true;
          snake.running = false;
          clearInterval(snake.timer);
          snake.timer = null;
          playNavBeepSound(340);
          render();
          return;
        }
        snake.body.unshift(head);
        if (head.x === snake.food.x && head.y === snake.food.y) {
          snake.score += 10;
          if (snake.score > state.snakeHigh) {
            state.snakeHigh = snake.score;
            savePrefs();
          }
          playNavBeepSound(1244);
          spawnFood();
          const scoreEl = document.getElementById("snakeScoreVal");
          const highEl = document.getElementById("snakeHighVal");
          if (scoreEl) scoreEl.textContent = snake.score;
          if (highEl) highEl.textContent = state.snakeHigh;
        } else {
          snake.body.pop();
        }
        drawSnake();
      }

      function drawSnake() {
        const canvas = document.getElementById("snakeCanvas");
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        canvas.width = Math.floor(rect.width);
        canvas.height = Math.floor(rect.height);
        const ctx = canvas.getContext("2d");
        const styles = getComputedStyle(phoneShell);
        const bg = styles.getPropertyValue("--lcd-bg-dark").trim() || "#a39720";
        const ink = styles.getPropertyValue("--lcd-ink").trim() || "#11110d";

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cw = canvas.width / snake.cols;
        const ch = canvas.height / snake.rows;

        ctx.fillStyle = ink;
        ctx.beginPath();
        ctx.arc(snake.food.x * cw + cw / 2, snake.food.y * ch + ch / 2, Math.min(cw, ch) * 0.34, 0, Math.PI * 2);
        ctx.fill();

        snake.body.forEach((seg, idx) => {
          ctx.fillStyle = ink;
          const pad = idx === 0 ? 0.5 : 1.3;
          ctx.fillRect(seg.x * cw + pad, seg.y * ch + pad, Math.max(2, cw - pad * 2), Math.max(2, ch - pad * 2));
        });
      }

      function stopCall() {
        if (state.callTimer) {
          clearInterval(state.callTimer);
          state.callTimer = null;
        }
        state.callSeconds = 0;
      }

      function goHome(animateMenuExit = false) {
        stopSnake();
        stopCall();
        if (animateMenuExit && state.view === "menu" && !state.menuClosing) {
          const overlay = document.getElementById("menuOverlay");
          if (overlay) {
            state.menuClosing = true;
            const bgHome = lcdBody.querySelector(".home-view");
            if (bgHome) bgHome.classList.remove("dimmed");
            overlay.classList.remove("entering");
            overlay.classList.add("closing");
            setTimeout(() => {
              state.menuClosing = false;
              state.view = "home";
              state.dialNumber = "";
              render();
            }, 360);
            return;
          }
        }
        state.menuClosing = false;
        state.view = "home";
        state.dialNumber = "";
        render();
      }

      function openApp(appId) {
        stopSnake();
        if (appId === "snake") {
          state.view = "snake";
          startSnake();
          return;
        }
        if (appId === "settings" || appId === "customize") {
          state.view = "customize";
          state.customizeIndex = 0;
          render();
          return;
        }
        if (appId === "calc") {
          state.view = "calc";
          state.calcValue = "0";
          state.calcPrev = null;
          state.calcOp = null;
          state.calcReset = false;
          render();
          return;
        }
        if (window.AndroidLauncher) {
          if (appId === "camera") { window.AndroidLauncher.openCamera(); return; }
          if (appId === "browser") { window.AndroidLauncher.openBrowser(); return; }
          const realList = getActiveAppList();
          const realApp = realList.find((a) => a.pkg === appId || a.id === appId);
          if (realApp && realApp.pkg) {
            window.AndroidLauncher.launchApp(realApp.pkg);
            return;
          }
        }
        const allApps = getActiveAppList();
        const found = allApps.find((a) => a.id === appId) || { id: appId, name: appId, emoji: "📱", bg: "#2563eb" };
        state.activeApp = found;
        state.view = "appPreview";
        render();
      }

      function handleCalcDigit(d) {
        if (d === "*" || d === "#") return;
        if (state.calcReset || state.calcValue === "0") {
          state.calcValue = d;
          state.calcReset = false;
        } else if (state.calcValue.length < 10) {
          state.calcValue += d;
        }
        render();
      }

      function handleCalcOp(op) {
        const current = parseFloat(state.calcValue) || 0;
        if (op === "C") {
          state.calcValue = "0";
          state.calcPrev = null;
          state.calcOp = null;
          state.calcReset = false;
          render();
          return;
        }
        if (op === "=") {
          if (state.calcPrev !== null && state.calcOp) {
            let res = current;
            if (state.calcOp === "+") res = state.calcPrev + current;
            if (state.calcOp === "-") res = state.calcPrev - current;
            if (state.calcOp === "×") res = state.calcPrev * current;
            if (state.calcOp === "÷") res = current === 0 ? 0 : state.calcPrev / current;
            state.calcValue = String(Number(res.toFixed(4)));
            state.calcPrev = null;
            state.calcOp = null;
            state.calcReset = true;
          }
          render();
          return;
        }
        state.calcPrev = current;
        state.calcOp = op;
        state.calcReset = true;
        render();
      }

      function getCustomizeRows() {
        return [
          { id: "body", label: "Color del teléfono", value: BODY_THEMES[state.bodyIdx].name },
          { id: "lcd", label: "Tema de pantalla", value: LCD_THEMES[state.lcdIdx].name },
          { id: "sound", label: "Sonido de teclas", value: state.soundOn ? "Sí" : "No" },
          { id: "clock", label: "Formato de hora", value: state.use24h ? "24h" : "12h" }
        ];
      }

      function toggleCustomizeRow(idx) {
        const rows = getCustomizeRows();
        const row = rows[idx];
        if (!row) return;
        if (row.id === "body") state.bodyIdx = (state.bodyIdx + 1) % BODY_THEMES.length;
        else if (row.id === "lcd") state.lcdIdx = (state.lcdIdx + 1) % LCD_THEMES.length;
        else if (row.id === "sound") state.soundOn = !state.soundOn;
        else if (row.id === "clock") state.use24h = !state.use24h;
        savePrefs();
        applyThemes();
        render();
      }

      function render() {
        lcdStatus.classList.toggle("dark-status", false);

        if (state.view === "home") {
          setSoftkeys("Ir a", "Menú", "Ajustes", false);
          lcdBody.innerHTML = `
            <div class="home-view">
              <div class="home-date">${formatDate()}</div>
              <div class="home-clock-strip">
                <div class="home-line"></div>
                <div class="home-clock-ribbon">${formatClock4Digits()}</div>
              </div>
            </div>
          `;
          return;
        }

        if (state.view === "dialer") {
          setSoftkeys("", "Guardar", "Borrar", false);
          lcdBody.innerHTML = `
            <div class="dialer-view">
              <div class="dialer-number">${state.dialNumber}</div>
            </div>
          `;
          return;
        }

        if (state.view === "calling") {
          const mins = String(Math.floor(state.callSeconds / 60)).padStart(2, "0");
          const secs = String(state.callSeconds % 60).padStart(2, "0");
          setSoftkeys("Altavoz", "", "Colgar", false);
          lcdBody.innerHTML = `
            <div class="calling-view">
              <div class="calling-ring">📞</div>
              <div style="font-size:12px;font-weight:700;">Llamando...</div>
              <div style="font-size:18px;font-weight:900;">${state.dialNumber || "523"}</div>
              <div style="font-size:12px;font-weight:700;opacity:0.8;">${mins}:${secs}</div>
            </div>
          `;
          return;
        }

        if (state.view === "goto") {
          setSoftkeys("", "", "Salir", false);
          const htmlItems = GOTO_ITEMS.map((item, idx) => `
            <div class="list-item ${idx === state.gotoIndex ? "selected" : ""}" data-goto-idx="${idx}">
              <span>${item.label}</span>
            </div>
          `).join("");
          lcdBody.innerHTML = `
            <div class="list-view">
              <div class="list-header">Ir a</div>
              ${htmlItems}
            </div>
          `;
          lcdBody.querySelectorAll("[data-goto-idx]").forEach((el) => {
            el.addEventListener("click", () => {
              state.gotoIndex = Number(el.getAttribute("data-goto-idx"));
              activateGotoItem();
            });
          });
          return;
        }

        if (state.view === "customize") {
          setSoftkeys("Cambiar", "", "Atrás", false);
          const rows = getCustomizeRows();
          const htmlItems = rows.map((row, idx) => `
            <div class="list-item ${idx === state.customizeIndex ? "selected" : ""}" data-cust-idx="${idx}">
              <span>${row.label}</span>
              <span class="list-item-val">${row.value}</span>
            </div>
          `).join("");
          lcdBody.innerHTML = `
            <div class="list-view">
              <div class="list-header">Personalizar Launcher</div>
              ${htmlItems}
            </div>
          `;
          lcdBody.querySelectorAll("[data-cust-idx]").forEach((el) => {
            el.addEventListener("click", () => {
              const idx = Number(el.getAttribute("data-cust-idx"));
              state.customizeIndex = idx;
              playNavBeepSound(933);
              toggleCustomizeRow(idx);
            });
          });
          return;
        }

        if (state.view === "menu") {
          setSoftkeys("Ir a", "Menú", "Ajustes", false);
          const allApps = getActiveAppList();
          const tilesHtml = allApps.map((app, idx) => `
            <div class="app-tile ${idx === state.menuIndex ? "selected" : ""}" data-app-idx="${idx}">
              <div class="app-icon" style="background:${app.bg || 'transparent'};">${app.icon ? `<img src="${app.icon}" alt="${app.name}"/>` : (app.emoji || '📱')}</div>
              <div class="app-name">${app.name}</div>
            </div>
          `).join("");
          const enterClass = state.menuAnimateIn ? "entering" : "";
          state.menuAnimateIn = false;
          lcdBody.innerHTML = `
            <div class="home-view dimmed">
              <div class="home-date">${formatDate()}</div>
              <div class="home-clock-strip">
                <div class="home-line"></div>
                <div class="home-clock-ribbon">${formatClock4Digits()}</div>
              </div>
            </div>
            <div class="menu-overlay ${enterClass}" id="menuOverlay">
              <div class="menu-scroll" id="menuScroll">
                ${tilesHtml}
              </div>
            </div>
          `;
          lcdBody.querySelectorAll("[data-app-idx]").forEach((el) => {
            el.addEventListener("click", () => {
              const idx = Number(el.getAttribute("data-app-idx"));
              state.menuIndex = idx;
              playNavBeepSound(933);
              openApp(allApps[idx].id);
            });
          });
          const sel = lcdBody.querySelector(".app-tile.selected");
          if (sel && sel.scrollIntoView) {
            sel.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
          return;
        }

        if (state.view === "snake") {
          setSoftkeys(snake.gameOver ? "Reintentar" : "Pausa", "", "Salir", false);
          lcdBody.innerHTML = `
            <div class="snake-view">
              <div class="snake-hud">
                <span>SNAKE</span>
                <span>Pts: <span id="snakeScoreVal">${snake.score}</span> · Máx: <span id="snakeHighVal">${state.snakeHigh}</span></span>
              </div>
              <div class="snake-canvas-wrap">
                <canvas id="snakeCanvas"></canvas>
                ${snake.gameOver ? `
                  <div class="snake-overlay">
                    <div>FIN DEL JUEGO</div>
                    <div>Puntos: ${snake.score}</div>
                    <div>Pulsa el centro para reintentar</div>
                  </div>
                ` : (!snake.running ? `
                  <div class="snake-overlay">
                    <div>PAUSA</div>
                    <div>Pulsa el centro para seguir</div>
                  </div>
                ` : "")}
              </div>
            </div>
          `;
          requestAnimationFrame(drawSnake);
          return;
        }

        if (state.view === "calc") {
          setSoftkeys("Limpiar", "=", "Atrás", false);
          lcdBody.innerHTML = `
            <div class="mini-app-view">
              <div class="list-header" style="padding-bottom:2px;">Calculadora</div>
              <div class="calc-display">${state.calcOp ? `${state.calcPrev} ${state.calcOp} ` : ""}${state.calcValue}</div>
              <div class="calc-ops">
                <button class="lcd-mini-btn" data-op="+">+</button>
                <button class="lcd-mini-btn" data-op="-">-</button>
                <button class="lcd-mini-btn" data-op="×">×</button>
                <button class="lcd-mini-btn" data-op="÷">÷</button>
              </div>
            </div>
          `;
          lcdBody.querySelectorAll("[data-op]").forEach((btn) => {
            btn.addEventListener("click", () => {
              playNavBeepSound(933);
              handleCalcOp(btn.getAttribute("data-op"));
            });
          });
          return;
        }

        if (state.view === "appPreview" && state.activeApp) {
          setSoftkeys("Inicio", "", "Atrás", false);
          lcdBody.innerHTML = `
            <div class="calling-view">
              <div style="font-size:30px;">${state.activeApp.emoji}</div>
              <div style="font-size:15px;font-weight:800;">${state.activeApp.name}</div>
              <div style="font-size:11px;font-weight:600;opacity:0.85;max-width:210px;line-height:1.4;">En el APK de Android, esto abre directamente ${state.activeApp.name} instalado en tu celular.</div>
            </div>
          `;
        }
      }

      function activateGotoItem() {
        const item = GOTO_ITEMS[state.gotoIndex];
        if (!item) return;
        playNavBeepSound(933);
        if (item.id === "exit") {
          if (window.AndroidLauncher && typeof window.AndroidLauncher.openHomeSettings === "function") {
            window.AndroidLauncher.openHomeSettings();
            return;
          }
          showToast("Salir del Launcher (vuelve a tu inicio Android)");
          goHome();
          return;
        }
        openApp(item.id);
      }

      function startCall() {
        if (window.AndroidLauncher && typeof window.AndroidLauncher.dialNumber === "function" && state.dialNumber) {
          window.AndroidLauncher.dialNumber(state.dialNumber);
          return;
        }
        stopCall();
        state.view = "calling";
        state.callSeconds = 0;
        playNavBeepSound(933);
        render();
        state.callTimer = setInterval(() => {
          state.callSeconds++;
          if (state.view === "calling") render();
        }, 1000);
      }

      function handleAction(action) {
        vibrate();
        if (action === "end") {
          playNavBeepSound(933);
          goHome(true);
          return;
        }

        if (action === "call") {
          if (state.view === "dialer" && state.dialNumber.length > 0) startCall();
          else if (state.view === "home") {
            state.dialNumber = "523";
            startCall();
          }
          return;
        }

        if (action === "soft-left") {
          playNavBeepSound(933);
          if (state.view === "home") {
            state.view = "goto";
            state.gotoIndex = 0;
            render();
          } else if (state.view === "goto") {
            activateGotoItem();
          } else if (state.view === "customize") {
            toggleCustomizeRow(state.customizeIndex);
          } else if (state.view === "snake") {
            if (snake.gameOver) startSnake();
            else { snake.running = !snake.running; render(); }
          } else if (state.view === "calc") {
            handleCalcOp("C");
          } else if (state.view === "appPreview") {
            goHome();
          } else if (state.view === "calling") {
            showToast("Altavoz activado");
          }
          return;
        }

        if (action === "soft-right") {
          playNavBeepSound(933);
          if (state.view === "home") {
            state.view = "customize";
            state.customizeIndex = 0;
            render();
          } else if (state.view === "dialer") {
            state.dialNumber = state.dialNumber.slice(0, -1);
            if (!state.dialNumber) state.view = "home";
            render();
          } else if (state.view === "calling") {
            goHome();
          } else if (state.view === "appPreview" || state.view === "calc") {
            state.view = "menu";
            render();
          } else {
            goHome(true);
          }
          return;
        }

        if (action === "ok") {
          playNavBeepSound(933);
          if (state.view === "home") {
            state.view = "menu";
            state.menuPage = 0;
            state.menuIndex = 0;
            state.menuAnimateIn = true;
            render();
          } else if (state.view === "dialer") {
            showToast("Guardado: " + state.dialNumber);
          } else if (state.view === "goto") {
            activateGotoItem();
          } else if (state.view === "menu") {
            const list = getActiveAppList();
            if (list[state.menuIndex]) openApp(list[state.menuIndex].id);
          } else if (state.view === "customize") {
            toggleCustomizeRow(state.customizeIndex);
          } else if (state.view === "snake") {
            if (snake.gameOver) startSnake();
            else { snake.running = !snake.running; render(); }
          } else if (state.view === "calc") {
            handleCalcOp("=");
          }
          return;
        }

        if (["up", "down", "left", "right"].includes(action)) {
          playNavBeepSound(933);
          if (state.view === "home") {
            if (action === "up") openApp("camera");
            if (action === "down") { state.view = "menu"; state.menuAnimateIn = true; render(); }
            if (action === "left") openApp("snake");
            if (action === "right") { state.view = "customize"; render(); }
            return;
          }
          if (state.view === "goto") {
            if (action === "up") state.gotoIndex = (state.gotoIndex - 1 + GOTO_ITEMS.length) % GOTO_ITEMS.length;
            if (action === "down") state.gotoIndex = (state.gotoIndex + 1) % GOTO_ITEMS.length;
            render();
            return;
          }
          if (state.view === "customize") {
            const len = getCustomizeRows().length;
            if (action === "up") state.customizeIndex = (state.customizeIndex - 1 + len) % len;
            if (action === "down") state.customizeIndex = (state.customizeIndex + 1) % len;
            if (action === "left" || action === "right") toggleCustomizeRow(state.customizeIndex);
            else render();
            return;
          }
          if (state.view === "menu") {
            const total = getActiveAppList().length;
            if (action === "right") state.menuIndex = (state.menuIndex + 1) % total;
            else if (action === "left") state.menuIndex = (state.menuIndex - 1 + total) % total;
            else if (action === "down") state.menuIndex = (state.menuIndex + 4) % total;
            else if (action === "up") state.menuIndex = (state.menuIndex - 4 + total) % total;
            render();
            return;
          }
          if (state.view === "snake" && snake.running) {
            if (action === "up" && snake.dir.y === 0) snake.nextDir = { x: 0, y: -1 };
            if (action === "down" && snake.dir.y === 0) snake.nextDir = { x: 0, y: 1 };
            if (action === "left" && snake.dir.x === 0) snake.nextDir = { x: -1, y: 0 };
            if (action === "right" && snake.dir.x === 0) snake.nextDir = { x: 1, y: 0 };
          }
        }
      }

      function handleDigit(digit) {
        vibrate();
        playDtmfSound(digit);
        if (state.view === "snake" && snake.running) {
          if (digit === "2" && snake.dir.y === 0) snake.nextDir = { x: 0, y: -1 };
          if (digit === "8" && snake.dir.y === 0) snake.nextDir = { x: 0, y: 1 };
          if (digit === "4" && snake.dir.x === 0) snake.nextDir = { x: -1, y: 0 };
          if (digit === "6" && snake.dir.x === 0) snake.nextDir = { x: 1, y: 0 };
          return;
        }
        if (state.view === "calc") {
          handleCalcDigit(digit);
          return;
        }
        if (state.view === "home" || state.view === "dialer") {
          if (state.dialNumber.length < 18) {
            state.dialNumber += digit;
            state.view = "dialer";
            render();
          }
        }
      }

      document.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => handleAction(btn.getAttribute("data-action")));
      });

      document.querySelectorAll("[data-digit]").forEach((btn) => {
        btn.addEventListener("click", () => handleDigit(btn.getAttribute("data-digit")));
      });

      window.addEventListener("keydown", (e) => {
        if (e.key >= "0" && e.key <= "9") handleDigit(e.key);
        else if (e.key === "*" || e.key === "#") handleDigit(e.key);
        else if (e.key === "ArrowUp") { e.preventDefault(); handleAction("up"); }
        else if (e.key === "ArrowDown") { e.preventDefault(); handleAction("down"); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); handleAction("left"); }
        else if (e.key === "ArrowRight") { e.preventDefault(); handleAction("right"); }
        else if (e.key === "Enter") { e.preventDefault(); handleAction("ok"); }
        else if (e.key === "Backspace") { e.preventDefault(); handleAction("soft-right"); }
        else if (e.key === "Escape") { e.preventDefault(); handleAction("end"); }
      });

      window.addEventListener("resize", () => {
        if (state.view === "snake") drawSnake();
      });

      setInterval(() => {
        if (state.view === "home") render();
      }, 15000);

      loadRealAndroidApps();
      applyThemes();
      render();
    })();
  </script>
</body>
</html>
