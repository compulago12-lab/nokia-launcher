<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nokia Classic Launcher — Español + Juegos Clásicos</title>
  <style>
    :root {
      --body-bg: #0c0d0f;
      --key-hover: rgba(255, 255, 255, 0.06);
      --key-active: rgba(255, 255, 255, 0.14);
      --key-text: #f3f4f6;
      --key-sub: #a1a1aa;
      --dpad-ring: #d4d4d8;

      /* Color exacto verde-oliva muestreado del video de referencia (#9B9236) */
      --lcd-bg: #9b9236;
      --lcd-bg-dark: #8a822d;
      --lcd-ink: #11120c;
      --lcd-highlight-bg: #11120c;
      --lcd-highlight-ink: #aba240;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050506;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      color: var(--key-text);
      overflow: hidden;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .phone {
      width: 100%;
      height: 100%;
      background: var(--body-bg);
      display: flex;
      flex-direction: column;
      padding: 44px 12px 18px 12px;
      position: relative;
      transition: background 0.22s ease;
    }

    @media (min-width: 520px) {
      .stage {
        padding: 14px;
      }
      .phone {
        width: min(390px, 100%);
        height: min(800px, calc(100vh - 28px));
        border-radius: 34px;
        padding: 26px 14px 18px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    /* Temas de carcasa */
    .phone[data-body="black"] {
      --body-bg: #0c0d0f;
      --key-text: #f3f4f6;
      --key-sub: #a1a1aa;
      --dpad-ring: #d4d4d8;
    }

    .phone[data-body="cyan"] {
      --body-bg: #15a8df;
      --key-text: #063b52;
      --key-sub: #0b5575;
      --dpad-ring: #0a4e6b;
    }

    .phone[data-body="silver"] {
      --body-bg: #4b5563;
      --key-text: #f9fafb;
      --key-sub: #d1d5db;
      --dpad-ring: #e5e7eb;
    }

    .phone[data-body="red"] {
      --body-bg: #991b1b;
      --key-text: #fff5f5;
      --key-sub: #fecaca;
      --dpad-ring: #fee2e2;
    }

    /* Temas de pantalla LCD */
    .phone[data-lcd="olive"] {
      --lcd-bg: #9b9236;
      --lcd-bg-dark: #8a822d;
      --lcd-ink: #11120c;
      --lcd-highlight-bg: #11120c;
      --lcd-highlight-ink: #aba240;
    }

    .phone[data-lcd="green"] {
      --lcd-bg: #86a662;
      --lcd-bg-dark: #759452;
      --lcd-ink: #121d0a;
      --lcd-highlight-bg: #121d0a;
      --lcd-highlight-ink: #97b872;
    }

    .phone[data-lcd="blue"] {
      --lcd-bg: #7ab6d6;
      --lcd-bg-dark: #66a3c4;
      --lcd-ink: #0a1c29;
      --lcd-highlight-bg: #0a1c29;
      --lcd-highlight-ink: #9ad1ee;
    }

    .phone[data-lcd="oled"] {
      --lcd-bg: #111317;
      --lcd-bg-dark: #1a1d24;
      --lcd-ink: #f3f4f6;
      --lcd-highlight-bg: #f3f4f6;
      --lcd-highlight-ink: #111317;
    }

    .brand {
      text-align: center;
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: var(--key-text);
      margin-bottom: 14px;
      font-family: "Arial Black", "Inter", sans-serif;
      opacity: 0.92;
      flex-shrink: 0;
    }

    /* Pantalla LCD proporcional universal */
    .lcd {
      flex: 0 0 46%;
      height: 46%;
      min-height: 220px;
      background: var(--lcd-bg);
      color: var(--lcd-ink);
      border-radius: 6px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.35);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .lcd-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 2px;
      height: 22px;
      z-index: 6;
      flex-shrink: 0;
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lcd-body {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 5;
    }

    /* Pantalla de inicio */
    .home-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 0 2px;
      position: relative;
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s ease;
    }

    .home-view.dimmed {
      transform: scale(0.92);
      opacity: 0.45;
    }

    .home-date {
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      margin-top: 38px;
      letter-spacing: 0.02em;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .home-clock-strip {
      position: relative;
      width: 100%;
      height: 44px;
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .home-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      height: 1.5px;
      background: var(--lcd-ink);
    }

    .home-clock-ribbon {
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
      padding: 4px 10px 4px 22px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%);
      position: relative;
      z-index: 2;
      margin-bottom: 6px;
      font-family: "Courier New", Courier, monospace;
    }

    /* Marcador */
    .dialer-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 8px 10px 6px;
      text-align: right;
    }

    .dialer-number {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.04em;
      word-break: break-all;
      line-height: 1.1;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    /* Llamada / Vista previa */
    .calling-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .calling-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--lcd-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      animation: pulseRing 1.2s infinite ease-in-out;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(0.94); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* Listas (Ir a / Juegos / Personalizar / Submenú Snake II) */
    .list-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 0 4px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .list-header {
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 0 6px;
    }

    .list-item {
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-item.selected {
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
    }

    .list-item-val {
      font-size: 11px;
      opacity: 0.85;
    }

    /* Barra de nivel estilo Nokia 3310 (Snake II) */
    .level-bars-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
    }

    .level-bars {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 76px;
    }

    .level-bar {
      width: 14px;
      border: 1.5px solid var(--lcd-ink);
      background: transparent;
    }

    .level-bar.filled {
      background: var(--lcd-ink);
    }

    /* Cajón de apps (Menú) — animación 1:1 del video */
    .menu-overlay {
      position: absolute;
      inset: 0;
      background: rgba(12, 14, 18, 0.72);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      overflow: hidden;
      z-index: 15;
      will-change: opacity;
    }

    .menu-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 10px 8px 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 6px;
      align-content: start;
      transform-origin: center center;
      will-change: transform, opacity, filter;
    }

    .menu-scroll::-webkit-scrollbar { width: 3px; }
    .menu-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 999px; }

    .menu-overlay.entering { animation: menuBackdropIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .menu-overlay.entering .menu-scroll { animation: menuZoomEnter 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .menu-overlay.closing { animation: menuBackdropOut 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards; pointer-events: none; }
    .menu-overlay.closing .menu-scroll { animation: menuZoomExit 0.36s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

    @keyframes menuBackdropIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes menuBackdropOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes menuZoomEnter {
      0% { opacity: 0; transform: scale(2.85) translateZ(0); filter: blur(5px); }
      55% { opacity: 0.95; filter: blur(0.5px); }
      100% { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0px); }
    }
    @keyframes menuZoomExit {
      0% { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0px); }
      100% { opacity: 0; transform: scale(2.85) translateZ(0); filter: blur(5px); }
    }

    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 3px 2px;
      border-radius: 10px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform 0.08s ease, background 0.12s ease;
    }

    .app-tile.selected {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(250, 204, 21, 0.9);
    }

    .app-tile:active { transform: scale(0.92); }

    .app-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .app-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    }

    .app-name {
      font-size: 9px;
      font-weight: 500;
      color: #e5e7eb;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Juegos Canvas (Snake II / Space Impact) */
    .game-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2px 6px 4px;
      overflow: hidden;
    }

    .game-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 900;
      padding-bottom: 3px;
      border-bottom: 1.5px solid var(--lcd-ink);
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .game-canvas-wrap {
      flex: 1;
      position: relative;
      border: 2px solid var(--lcd-ink);
      background: var(--lcd-bg);
      overflow: hidden;
    }

    .game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .game-overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 18, 12, 0.88);
      color: var(--lcd-highlight-ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    /* Bantumi (Nokia 3310) */
    .bantumi-board {
      flex: 1;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      gap: 5px;
      align-items: center;
      padding: 4px 2px;
    }

    .bantumi-store {
      height: 116px;
      border: 2px solid var(--lcd-ink);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      background: var(--lcd-bg-dark);
    }

    .bantumi-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bantumi-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }

    .bantumi-pit {
      height: 46px;
      border: 1.5px solid var(--lcd-ink);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .bantumi-pit.selected {
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
    }

    /* Calculadora */
    .mini-app-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 4px 8px;
      gap: 6px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .calc-display {
      border: 1.5px solid var(--lcd-ink);
      padding: 8px;
      text-align: right;
      font-size: 20px;
      font-weight: 900;
      background: var(--lcd-bg-dark);
      border-radius: 4px;
      min-height: 40px;
      font-family: "Courier New", Courier, monospace;
    }

    .calc-ops {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .lcd-mini-btn {
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
      border: none;
      border-radius: 3px;
      padding: 6px 4px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Barra de teclas suaves */
    .lcd-softkeys {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 3px 8px 5px;
      font-size: 12px;
      font-weight: 700;
      z-index: 6;
      flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .lcd-softkeys.hidden { display: none; }
    .soft-left { text-align: left; }
    .soft-center { text-align: center; }
    .soft-right { text-align: right; }

    /* Aviso interno */
    .lcd-toast {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 28px;
      background: var(--lcd-highlight-bg);
      color: var(--lcd-highlight-ink);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      z-index: 30;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    .lcd-toast.show { opacity: 1; transform: translateY(0); }

    /* Teclado negro mate continuo */
    .keypad {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 4px 4px;
      gap: 6px;
    }

    .nav-cluster {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      gap: 10px;
      align-items: center;
    }

    .nav-side {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .key {
      background: transparent;
      color: var(--key-text);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.08s ease, transform 0.06s ease;
      font-family: inherit;
    }

    @media (hover: hover) {
      .key:hover { background: var(--key-hover); }
    }

    .key:active, .key.pressed {
      background: var(--key-active);
      transform: scale(0.95);
    }

    .key-soft { height: 38px; }
    .soft-dash {
      width: 24px;
      height: 2.2px;
      background: var(--key-text);
      border-radius: 2px;
      opacity: 0.92;
    }

    .key-call { height: 38px; color: #16a34a; }
    .key-end { height: 38px; color: #dc2626; }

    /* Cruceta cuadrada minimalista */
    .dpad {
      height: 78px;
      width: 78px;
      margin: 0 auto;
      background: transparent;
      border: 2.2px solid var(--dpad-ring);
      border-radius: 18px;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1.25fr 1fr;
      grid-template-rows: 1fr 1.25fr 1fr;
      overflow: hidden;
    }

    .dpad-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.08s ease;
    }

    .dpad-btn:active { background: rgba(255, 255, 255, 0.16); }
    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-ok { grid-column: 2; grid-row: 2; border-radius: 8px; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    /* Cuadrícula T9 */
    .t9-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 10px;
      flex: 1;
      align-items: center;
    }

    .key-num {
      height: 100%;
      min-height: 0;
      gap: 6px;
      align-items: center;
      padding: 2px 0;
    }

    .key-digit { font-size: 18px; font-weight: 600; line-height: 1; }
    .key-letters { font-size: 9.5px; color: var(--key-sub); font-weight: 500; letter-spacing: 0.02em; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone" id="phoneShell" data-body="black" data-lcd="olive">
      <div class="brand">NOKIA</div>

      <div class="lcd" id="lcdScreen">
        <div class="lcd-status" id="lcdStatus">
          <div class="status-left">
            <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-label="Señal">
              <path d="M1 1H7L4 5V11M4 1V5" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/>
              <rect x="9" y="8" width="2.2" height="3.2" fill="currentColor"/>
              <rect x="12.5" y="6" width="2.2" height="5.2" fill="currentColor"/>
              <rect x="16" y="3.8" width="2.2" height="7.4" fill="currentColor"/>
              <rect x="19.5" y="1.5" width="2.2" height="9.7" fill="currentColor"/>
            </svg>
          </div>
          <div class="status-right">
            <svg width="14" height="11" viewBox="0 0 16 12" fill="none" aria-label="Wi-Fi">
              <path d="M1.2 4C5 0.6 11 0.6 14.8 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M3.9 6.9C6.2 4.8 9.8 4.8 12.1 6.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="8" cy="9.8" r="1.3" fill="currentColor"/>
            </svg>
            <svg width="20" height="11" viewBox="0 0 22 11" fill="none" aria-label="Batería">
              <rect x="1" y="1.2" width="17.5" height="8.6" rx="1.2" stroke="currentColor" stroke-width="1.3"/>
              <rect x="19.2" y="3.5" width="1.8" height="4" rx="0.5" fill="currentColor"/>
              <rect x="3" y="3" width="3.5" height="5" fill="currentColor"/>
              <rect x="7.8" y="3" width="3.5" height="5" fill="currentColor"/>
              <rect x="12.6" y="3" width="3.5" height="5" fill="currentColor"/>
            </svg>
          </div>
        </div>

        <div class="lcd-body" id="lcdBody"></div>

        <div class="lcd-softkeys" id="lcdSoftkeys">
          <span class="soft-left" id="softLeftLabel" style="cursor:pointer;">Ir a</span>
          <span class="soft-center" id="softCenterLabel" style="cursor:pointer;">Menú</span>
          <span class="soft-right" id="softRightLabel" style="cursor:pointer;">Ajustes</span>
        </div>

        <div class="lcd-toast" id="lcdToast"></div>
      </div>

      <div class="keypad">
        <div class="nav-cluster">

  <script>
    (function () {
      const BODY_THEMES = [

      const SAMPLE_APPS = [

        { id: "clock", name: "Reloj", emoji: "⏰", bg: "#0d9488" },
        { id: "settings", name: "Ajustes", emoji: "⚙️", bg: "#475569" }

      const GOTO_ITEMS = [

      const GAMES_LIST = [

      const SNAKE_MAZES = [

      let REAL_ANDROID_APPS = null;

      function loadRealAndroidApps() {
        if (window.AndroidLauncher && typeof window.AndroidLauncher.getInstalledApps === "function") {
          try {
            const parsed = JSON.parse(window.AndroidLauncher.getInstalledApps() || "[]");
            if (Array.isArray(parsed) && parsed.length > 0) {

            }
          } catch (e) {}
        }
      }

      function getActiveAppList() {
        if (REAL_ANDROID_APPS && REAL_ANDROID_APPS.length > 0) return REAL_ANDROID_APPS;
        return SAMPLE_APPS;
      }

      const state = {
        view: "home", // home | dialer | calling | menu | goto | games | snakeMenu | snakeLevel | snakeMaze | snake | spaceImpact | bantumi | customize | calc | appPreview
        dialNumber: "",
        gotoIndex: 0,
        gamesIndex: 0,
        snakeMenuIndex: 0,
        menuIndex: 0,
        menuAnimateIn: false,
        menuClosing: false,
        customizeIndex: 0,
        bodyIdx: 0,
        lcdIdx: 0,
        soundOn: true,
        use24h: false,
        activeApp: null,
        callSeconds: 0,
        callTimer: null,
        calcValue: "0",
        calcPrev: null,
        calcOp: null,
        calcReset: false,
        snakeLevel: 6, // 1..9
        snakeMazeIdx: 0,
        snakeHigh: 0,
        spaceHigh: 0
      };

      try {
        const saved = JSON.parse(localStorage.getItem("nokia_v2_prefs") || "{}");
        if (typeof saved.bodyIdx === "number") state.bodyIdx = saved.bodyIdx % BODY_THEMES.length;
        if (typeof saved.lcdIdx === "number") state.lcdIdx = saved.lcdIdx % LCD_THEMES.length;
        if (typeof saved.soundOn === "boolean") state.soundOn = saved.soundOn;
        if (typeof saved.use24h === "boolean") state.use24h = saved.use24h;
        if (typeof saved.snakeLevel === "number") state.snakeLevel = Math.min(9, Math.max(1, saved.snakeLevel));
        if (typeof saved.snakeMazeIdx === "number") state.snakeMazeIdx = saved.snakeMazeIdx % SNAKE_MAZES.length;
        if (typeof saved.snakeHigh === "number") state.snakeHigh = saved.snakeHigh;
        if (typeof saved.spaceHigh === "number") state.spaceHigh = saved.spaceHigh;
      } catch (e) {}

      function savePrefs() {
        try {
          localStorage.setItem("nokia_v2_prefs", JSON.stringify({
            bodyIdx: state.bodyIdx,
            lcdIdx: state.lcdIdx,
            soundOn: state.soundOn,
            use24h: state.use24h,
            snakeLevel: state.snakeLevel,
            snakeMazeIdx: state.snakeMazeIdx,
            snakeHigh: state.snakeHigh,
            spaceHigh: state.spaceHigh
          }));
        } catch (e) {}
      }

      /* =====================================================================
         TRES SONIDOS EXACTOS DEL VIDEO DE REFERENCIA:
         1) Números (0-9, *, #): DTMF dual-tone senoidal (~95ms)
         2) Ir a / Ajustes / navegación: mismo bleep corto Nokia (933 Hz, ~46ms)
         3) Botón Menú (centro de la cruceta): sonido de GOTA de agua ("bloop")
      ===================================================================== */
      let audioCtx = null;
      const DTMF_FREQS = {
        "1": [697, 1209], "2": [697, 1336], "3": [697, 1477],
        "4": [770, 1209], "5": [770, 1336], "6": [770, 1477],
        "7": [852, 1209], "8": [852, 1336], "9": [852, 1477],
        "*": [941, 1209], "0": [941, 1336], "#": [941, 1477]
      };

      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
      }

      // Sonido 1: DTMF para teclas numéricas
      function playDtmfSound(digit) {
        if (!state.soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        const pair = DTMF_FREQS[digit] || [697, 1209];
        const now = audioCtx.currentTime;
        const dur = 0.095;
        pair.forEach((freq) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.075, now + 0.005);
          gain.gain.setValueAtTime(0.075, now + dur - 0.012);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.005);
        });
      }

      // Sonido 2: Ir a / Ajustes / navegación (clic corto doble armónico 640+960 Hz medido en el video)
      function playSoftkeySound() {
        if (!state.soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const dur = 0.042;
        [640, 960].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = i === 0 ? "triangle" : "sine";
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(i === 0 ? 0.09 : 0.055, now + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.006);
        });
      }

      // Sonido 3: Gota de agua ("bloop" líquido 620 Hz -> 1620 Hz medido en el video al abrir Menú)
      function playMenuDropSound() {
        if (!state.soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(1640, now + 0.062);
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1100, now);
        filter.Q.setValueAtTime(1.8, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      }

      function playRetroSfx(type) {
        if (!state.soundOn) return;
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        if (type === "eat") {
          osc.type = "square";
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1320, now + 0.035);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.09);
        } else if (type === "bonus") {
          osc.type = "square";
          osc.frequency.setValueAtTime(1046, now);
          osc.frequency.setValueAtTime(1318, now + 0.045);
          osc.frequency.setValueAtTime(1568, now + 0.09);
          gain.gain.setValueAtTime(0.055, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.17);
        } else if (type === "shoot") {
          osc.type = "square";
          osc.frequency.setValueAtTime(1100, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.055);
          gain.gain.setValueAtTime(0.045, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.065);
        } else if (type === "boom") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.16);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.18);
        } else if (type === "gameover") {
          osc.type = "square";
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(370, now + 0.11);
          osc.frequency.setValueAtTime(293, now + 0.22);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.42);
        }
      }

      function vibrate(ms = 12) {
        if (window.AndroidLauncher && typeof window.AndroidLauncher.vibrate === "function") {
          try { window.AndroidLauncher.vibrate(ms); return; } catch (e) {}
        }
        if (navigator.vibrate) {
          try { navigator.vibrate(ms); } catch (e) {}
        }
      }

      const phoneShell = document.getElementById("phoneShell");
      const lcdBody = document.getElementById("lcdBody");
      const lcdSoftkeys = document.getElementById("lcdSoftkeys");
      const softLeftLabel = document.getElementById("softLeftLabel");
      const softCenterLabel = document.getElementById("softCenterLabel");
      const softRightLabel = document.getElementById("softRightLabel");
      const lcdToast = document.getElementById("lcdToast");

      let toastTimer = null;
      function showToast(msg) {
        lcdToast.textContent = msg;
        lcdToast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => lcdToast.classList.remove("show"), 1800);
      }

      function applyThemes() {
        phoneShell.setAttribute("data-body", BODY_THEMES[state.bodyIdx].id);
        phoneShell.setAttribute("data-lcd", LCD_THEMES[state.lcdIdx].id);
      }

      function formatClockDisplay() {
        const now = new Date();
        const rawH = now.getHours();
        const m = String(now.getMinutes()).padStart(2, "0");
        if (state.use24h) return `${String(rawH).padStart(2, "0")}:${m}`;
        const period = rawH >= 12 ? "pm" : "am";
        const h12 = rawH % 12 || 12;
        return `${String(h12).padStart(2, "0")}:${m} ${period}`;
      }

      function formatDate() {
        const now = new Date();
        const days = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
        const months = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
        return `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
      }

      function setSoftkeys(left, center, right, hideBar = false) {
        softLeftLabel.textContent = left;
        softCenterLabel.textContent = center;
        softRightLabel.textContent = right;
        lcdSoftkeys.classList.toggle("hidden", hideBar);
      }

      /* =====================================================================
         JUEGO 1: SNAKE II COMPLETO (NOKIA 3310)
         - Niveles 1 al 9 (velocidad real del Nokia 3310)
         - 5 Laberintos (Sin laberinto, Caja, Túnel, Molino, Rieles)
         - Bicho bonus cada 5 comidas con barra de tiempo
         - Cola de giros (input queue) para que nunca se trabe al girar rápido
      ===================================================================== */
      const snake = {
        timer: null,
        cols: 22,
        rows: 14,
        body: [],
        walls: [],
        dir: { x: 1, y: 0 },
        dirQueue: [],
        food: { x: 14, y: 7 },
        bonus: null,
        bonusTicks: 0,
        eatenCount: 0,
        score: 0,
        running: false,
        gameOver: false
      };

      function buildMazeWalls(mazeId) {
        const w = [];
        const C = snake.cols, R = snake.rows;
        if (mazeId === "box") {
          for (let x = 0; x < C; x++) { w.push({ x, y: 0 }); w.push({ x, y: R - 1 }); }
          for (let y = 1; y < R - 1; y++) { w.push({ x: 0, y }); w.push({ x: C - 1, y }); }
        } else if (mazeId === "tunnel") {
          for (let x = 0; x < 7; x++) { w.push({ x, y: 0 }); w.push({ x: C - 1 - x, y: 0 }); w.push({ x, y: R - 1 }); w.push({ x: C - 1 - x, y: R - 1 }); }
          for (let x = 6; x < C - 6; x++) { w.push({ x, y: 4 }); w.push({ x, y: R - 5 }); }
        } else if (mazeId === "mill") {
          for (let y = 2; y < 8; y++) w.push({ x: 6, y });
          for (let y = 6; y < R - 2; y++) w.push({ x: C - 7, y });
          for (let x = 10; x < C - 3; x++) w.push({ x, y: 3 });
          for (let x = 3; x < 12; x++) w.push({ x, y: R - 4 });
        } else if (mazeId === "rails") {
          for (let x = 0; x < C; x++) { w.push({ x, y: 0 }); w.push({ x, y: R - 1 }); }
          for (let x = 4; x < C - 4; x++) { w.push({ x, y: 5 }); w.push({ x, y: R - 6 }); }
        }
        return w;
      }

      function stopAllGames() {
        if (snake.timer) { clearInterval(snake.timer); snake.timer = null; }
        snake.running = false;
        if (space.timer) { clearInterval(space.timer); space.timer = null; }
        space.running = false;
      }

      function isSnakeCellOccupied(x, y) {
        return snake.body.some((s) => s.x === x && s.y === y) ||
               snake.walls.some((w) => w.x === x && w.y === y) ||
               (snake.bonus && snake.bonus.x === x && snake.bonus.y === y);
      }

      function spawnSnakeFood() {
        for (let t = 0; t < 300; t++) {
          const x = Math.floor(Math.random() * snake.cols);
          const y = Math.floor(Math.random() * snake.rows);
          if (!isSnakeCellOccupied(x, y)) {
            snake.food = { x, y };
            return;
          }
        }
      }

      function spawnSnakeBonus() {
        for (let t = 0; t < 300; t++) {
          const x = Math.floor(Math.random() * snake.cols);
          const y = Math.floor(Math.random() * snake.rows);
          if (!isSnakeCellOccupied(x, y) && (x !== snake.food.x || y !== snake.food.y)) {
            snake.bonus = { x, y };
            snake.bonusTicks = 28;
            return;
          }
        }
      }

      function startSnakeGame() {
        stopAllGames();
        const mazeId = SNAKE_MAZES[state.snakeMazeIdx].id;
        snake.walls = buildMazeWalls(mazeId);
        snake.body = [{ x: 8, y: 7 }, { x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
        snake.dir = { x: 1, y: 0 };
        snake.dirQueue = [];
        snake.bonus = null;
        snake.bonusTicks = 0;
        snake.eatenCount = 0;
        snake.score = 0;
        snake.gameOver = false;
        snake.running = true;
        spawnSnakeFood();
        state.view = "snake";
        render();
        const speedMs = Math.max(55, 210 - (state.snakeLevel - 1) * 18);
        snake.timer = setInterval(tickSnake, speedMs);
      }

      function queueSnakeDir(nx, ny) {
        const last = snake.dirQueue.length > 0 ? snake.dirQueue[snake.dirQueue.length - 1] : snake.dir;
        if (last.x + nx === 0 && last.y + ny === 0) return;
        if (last.x === nx && last.y === ny) return;
        if (snake.dirQueue.length < 2) snake.dirQueue.push({ x: nx, y: ny });
      }

      function tickSnake() {
        if (!snake.running || state.view !== "snake") return;
        if (snake.dirQueue.length > 0) snake.dir = snake.dirQueue.shift();
        const head = {
          x: (snake.body[0].x + snake.dir.x + snake.cols) % snake.cols,
          y: (snake.body[0].y + snake.dir.y + snake.rows) % snake.rows
        };

        const hitWall = snake.walls.some((w) => w.x === head.x && w.y === head.y);
        const hitSelf = snake.body.slice(0, -1).some((s) => s.x === head.x && s.y === head.y);
        if (hitWall || hitSelf) {
          snake.gameOver = true;
          snake.running = false;
          clearInterval(snake.timer);
          snake.timer = null;
          playRetroSfx("gameover");
          render();
          return;
        }

        snake.body.unshift(head);

        let grew = false;
        if (head.x === snake.food.x && head.y === snake.food.y) {
          grew = true;
          snake.eatenCount++;
          snake.score += state.snakeLevel;
          playRetroSfx("eat");
          spawnSnakeFood();
          if (snake.eatenCount % 5 === 0) spawnSnakeBonus();
        } else if (snake.bonus && head.x === snake.bonus.x && head.y === snake.bonus.y) {
          grew = true;
          snake.score += state.snakeLevel * 5 + snake.bonusTicks;
          snake.bonus = null;
          snake.bonusTicks = 0;
          playRetroSfx("bonus");
        }

        if (!grew) snake.body.pop();

        if (snake.bonus) {
          snake.bonusTicks--;
          if (snake.bonusTicks <= 0) snake.bonus = null;
        }

        if (snake.score > state.snakeHigh) {
          state.snakeHigh = snake.score;
          savePrefs();
        }

        const scEl = document.getElementById("snakeScoreHud");
        const bnEl = document.getElementById("snakeBonusHud");
        if (scEl) scEl.textContent = String(snake.score).padStart(4, "0");
        if (bnEl) bnEl.textContent = snake.bonus ? `★ ${snake.bonusTicks}` : `Nv.${state.snakeLevel}`;
        drawSnake();
      }

      // Helper 1-bit pixel sprite renderer (84x48 auténtico Nokia 3310)
      function drawBitmap(ctx, rows, x, y, ink) {
        ctx.fillStyle = ink;
        for (let r = 0; r < rows.length; r++) {
          const row = rows[r];
          for (let c = 0; c < row.length; c++) {
            if (row[c] === "1") ctx.fillRect(Math.floor(x + c), Math.floor(y + r), 1, 1);
          }
        }
      }

      const SPRITE_SNAKE_FOOD = [
        "010",
        "101",
        "010"
      ];
      const SPRITE_SNAKE_BUG = [
        "10101",
        "01110",
        "11011",
        "01110"
      ];

      function drawSnake() {
        const canvas = document.getElementById("snakeCanvas");
        if (!canvas) return;
        // Resolución real Nokia 3310: 88x56 (22x14 celdas de 4x4 px)
        canvas.width = snake.cols * 4;
        canvas.height = snake.rows * 4;
        const ctx = canvas.getContext("2d");
        const st = getComputedStyle(phoneShell);
        const bg = st.getPropertyValue("--lcd-bg").trim() || "#9b9236";
        const ink = st.getPropertyValue("--lcd-ink").trim() || "#11120c";

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Laberinto con patrón de ladrillo pixelado Nokia II
        snake.walls.forEach((w) => {
          const wx = w.x * 4, wy = w.y * 4;
          ctx.fillStyle = ink;
          ctx.fillRect(wx, wy, 4, 4);
          ctx.fillStyle = bg;
          ctx.fillRect(wx + 1, wy + 1, 1, 1);
        });

        // Comida diamante hueco 3x3 exacto de Snake II
        drawBitmap(ctx, SPRITE_SNAKE_FOOD, snake.food.x * 4 + 0.5, snake.food.y * 4 + 0.5, ink);

        // Bicho bonus 5x4 pixel-art (araña/escarabajo)
        if (snake.bonus) {
          drawBitmap(ctx, SPRITE_SNAKE_BUG, snake.bonus.x * 4, snake.bonus.y * 4, ink);
        }

        // Serpiente Nokia II con escamas, boca abierta al acercarse y cola afilada
        const head = snake.body[0];
        const nearFood = Math.abs(head.x - snake.food.x) + Math.abs(head.y - snake.food.y) <= 2;

        snake.body.forEach((seg, i) => {
          const sx = seg.x * 4, sy = seg.y * 4;
          ctx.fillStyle = ink;
          if (i === 0) {
            // Cabeza con ojo y boca abierta cerca de la comida
            ctx.fillRect(sx, sy, 4, 4);
            ctx.fillStyle = bg;
            ctx.fillRect(sx + 1, sy + 1, 1, 1);
            if (nearFood) {
              if (snake.dir.x > 0) ctx.fillRect(sx + 3, sy + 1, 1, 2);
              else if (snake.dir.x < 0) ctx.fillRect(sx, sy + 1, 1, 2);
              else if (snake.dir.y > 0) ctx.fillRect(sx + 1, sy + 3, 2, 1);
              else ctx.fillRect(sx + 1, sy, 2, 1);
            }
          } else if (i === snake.body.length - 1) {
            // Cola afilada
            ctx.fillRect(sx + 1, sy + 1, 2, 2);
          } else {
            // Escamas clásicas Snake II (segmentos alternos con punto interior)
            ctx.fillRect(sx, sy, 4, 4);
            ctx.fillStyle = bg;
            if (i % 2 === 0) {
              ctx.fillRect(sx + 1, sy + 1, 1, 1);
              ctx.fillRect(sx + 2, sy + 2, 1, 1);
            } else {
              ctx.fillRect(sx + 2, sy + 1, 1, 1);
              ctx.fillRect(sx + 1, sy + 2, 1, 1);
            }
          }
        });
      }

      /* =====================================================================
         JUEGO 2: SPACE IMPACT (EL DEL AVIÓN DE NOKIA 3310)
         - Nave del jugador a la izquierda, dispara láser y misiles especiales
         - Oleadas de enemigos, disparos enemigos, corazones (3 vidas), jefes
         - Niveles progresivos y récord guardado
      ===================================================================== */
      const space = {
        timer: null,
        w: 120,
        h: 72,
        player: { x: 8, y: 32, hp: 3, specials: 3, invul: 0 },
        bullets: [],
        ebullets: [],
        enemies: [],
        pickups: [],
        boss: null,
        stage: 1,
        score: 0,
        tick: 0,
        running: false,
        gameOver: false
      };

      function startSpaceImpact() {
        stopAllGames();
        space.player = { x: 8, y: 32, hp: 3, specials: 3, invul: 0 };
        space.bullets = [];
        space.ebullets = [];
        space.enemies = [];
        space.pickups = [];
        space.boss = null;
        space.stage = 1;
        space.score = 0;
        space.tick = 0;
        space.running = true;
        space.gameOver = false;
        state.view = "spaceImpact";
        render();
        space.timer = setInterval(tickSpace, 55);
      }

      function spaceShoot() {
        if (!space.running) return;
        space.bullets.push({ x: space.player.x + 11, y: space.player.y + 3, special: false });
        playRetroSfx("shoot");
      }

      function spaceSpecial() {
        if (!space.running || space.player.specials <= 0) return;
        space.player.specials--;
        for (let dy = -6; dy <= 6; dy += 6) {
          space.bullets.push({ x: space.player.x + 11, y: space.player.y + 3 + dy, special: true });
        }
        playRetroSfx("bonus");
      }

      function tickSpace() {
        if (!space.running || state.view !== "spaceImpact") return;
        space.tick++;
        if (space.player.invul > 0) space.player.invul--;

        // Auto-disparo suave cada 8 ticks para comodidad en pantalla táctil
        if (space.tick % 9 === 0) {
          space.bullets.push({ x: space.player.x + 11, y: space.player.y + 3, special: false });
        }

        // Generar oleadas o Jefe
        if (!space.boss) {
          if (space.tick > 0 && space.tick % 240 === 0) {
            space.boss = {
              x: space.w - 22,
              y: 22,
              vy: 1.2 + space.stage * 0.25,
              hp: 14 + space.stage * 8,
              maxHp: 14 + space.stage * 8
            };
          } else if (space.tick % Math.max(14, 28 - space.stage * 2) === 0) {
            const type = Math.random() < 0.35 ? "sine" : (Math.random() < 0.5 ? "shooter" : "fighter");
            space.enemies.push({
              x: space.w + 4,
              y: 8 + Math.random() * (space.h - 20),
              baseY: 0,
              vx: 1.8 + space.stage * 0.25,
              type,
              hp: type === "shooter" ? 2 : 1,
              phase: Math.random() * 6
            });
            space.enemies[space.enemies.length - 1].baseY = space.enemies[space.enemies.length - 1].y;
          }
        }

        // Mover balas jugador
        space.bullets.forEach((b) => { b.x += b.special ? 4.8 : 4.0; });
        space.bullets = space.bullets.filter((b) => b.x < space.w + 6);

        // Mover balas enemigas
        space.ebullets.forEach((b) => { b.x -= 2.8; });
        space.ebullets = space.ebullets.filter((b) => b.x > -4);

        // Mover enemigos
        space.enemies.forEach((e) => {
          e.x -= e.vx;
          if (e.type === "sine") {
            e.y = Math.max(4, Math.min(space.h - 12, e.baseY + Math.sin(space.tick * 0.14 + e.phase) * 12));
          }
          if (e.type === "shooter" && Math.random() < 0.025) {
            space.ebullets.push({ x: e.x - 2, y: e.y + 3 });
          }
        });
        space.enemies = space.enemies.filter((e) => e.x > -14);

        // Mover jefe
        if (space.boss) {
          space.boss.y += space.boss.vy;
          if (space.boss.y < 6 || space.boss.y > space.h - 24) space.boss.vy *= -1;
          if (space.tick % Math.max(14, 26 - space.stage * 2) === 0) {
            space.ebullets.push({ x: space.boss.x - 2, y: space.boss.y + 4 });
            space.ebullets.push({ x: space.boss.x - 2, y: space.boss.y + 14 });
          }
        }

        // Mover pickups
        space.pickups.forEach((p) => { p.x -= 1.5; });
        space.pickups = space.pickups.filter((p) => p.x > -8);

        // Colisiones balas jugador -> enemigos / jefe
        space.bullets.forEach((b) => {
          space.enemies.forEach((e) => {
            if (e.hp > 0 && b.x >= e.x - 2 && b.x <= e.x + 10 && b.y >= e.y - 2 && b.y <= e.y + 8) {
              e.hp -= b.special ? 3 : 1;
              b.x = 999;
              if (e.hp <= 0) {
                space.score += 20;
                playRetroSfx("boom");
                if (Math.random() < 0.14) {
                  space.pickups.push({ x: e.x, y: e.y, kind: Math.random() < 0.5 ? "life" : "spec" });
                }
              }
            }
          });
          if (space.boss && b.x >= space.boss.x && b.x <= space.boss.x + 18 && b.y >= space.boss.y && b.y <= space.boss.y + 18) {
            space.boss.hp -= b.special ? 3 : 1;
            b.x = 999;
            if (space.boss.hp <= 0) {
              space.score += 250 * space.stage;
              space.stage++;
              space.boss = null;
              space.player.specials = Math.min(5, space.player.specials + 1);
              playRetroSfx("bonus");
              showToast(`¡Nivel ${space.stage}!`);
            }
          }
        });
        space.enemies = space.enemies.filter((e) => e.hp > 0);
        space.bullets = space.bullets.filter((b) => b.x < 900);

        // Colisiones pickups
        space.pickups.forEach((p) => {
          if (Math.abs(p.x - space.player.x) < 10 && Math.abs(p.y - space.player.y) < 10) {
            if (p.kind === "life") space.player.hp = Math.min(5, space.player.hp + 1);
            else space.player.specials = Math.min(5, space.player.specials + 1);
            p.x = -99;
            playRetroSfx("eat");
          }
        });

        // Daño al jugador
        if (space.player.invul === 0) {
          let hit = false;
          space.enemies.forEach((e) => {
            if (Math.abs(e.x - space.player.x) < 9 && Math.abs(e.y - space.player.y) < 7) {
              e.hp = 0; hit = true;
            }
          });
          space.ebullets.forEach((eb) => {
            if (eb.x >= space.player.x && eb.x <= space.player.x + 10 && eb.y >= space.player.y && eb.y <= space.player.y + 7) {
              eb.x = -99; hit = true;
            }
          });
          if (hit) {
            space.player.hp--;
            space.player.invul = 25;
            playRetroSfx("boom");
            if (space.player.hp <= 0) {
              space.gameOver = true;
              space.running = false;
              clearInterval(space.timer);
              space.timer = null;
              playRetroSfx("gameover");
              render();
              return;
            }
          }
        }

        if (space.score > state.spaceHigh) {
          state.spaceHigh = space.score;
          savePrefs();
        }

        const hudL = document.getElementById("spaceHudLeft");
        const hudR = document.getElementById("spaceHudRight");
        if (hudL) hudL.textContent = "♥".repeat(Math.max(0, space.player.hp)) + " ★" + space.player.specials;
        if (hudR) hudR.textContent = `N${space.stage} ${String(space.score).padStart(5, "0")}`;
        drawSpace();
      }

      // Sprites 1-bit pixel-art auténticos de Space Impact (Nokia 3310 84x48)
      const SI_PLAYER = [
        "1100000000",
        "0111000000",
        "0011111000",
        "0110111111",
        "0011111000",
        "0111000000",
        "1100000000"
      ];
      const SI_ENEMY_FIGHTER = [
        "0001110",
        "0111101",
        "1101110",
        "0111101",
        "0001110"
      ];
      const SI_ENEMY_JELLY = [
        "0011100",
        "0110110",
        "1111111",
        "1010101",
        "0101010"
      ];
      const SI_ENEMY_SHOOTER = [
        "00111100",
        "01100110",
        "11111111",
        "01100110",
        "00111100"
      ];
      const SI_BOSS = [
        "00001111110000",
        "00111111111100",
        "01100111100110",
        "11100111100111",
        "11111111111111",
        "01111000011110",
        "00110111101100",
        "01100100100110",
        "11000000000011",
        "01100111100110",
        "00111111111100",
        "00001111110000"
      ];
      const SI_PICKUP = [
        "01110",
        "10101",
        "11111",
        "10101",
        "01110"
      ];

      function drawSpace() {
        const canvas = document.getElementById("spaceCanvas");
        if (!canvas) return;
        // Resolución real Nokia 3310: 84x48 píxeles monocromáticos
        canvas.width = 84;
        canvas.height = 48;
        const ctx = canvas.getContext("2d");
        const st = getComputedStyle(phoneShell);
        const bg = st.getPropertyValue("--lcd-bg").trim() || "#9b9236";
        const ink = st.getPropertyValue("--lcd-ink").trim() || "#11120c";

        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 84, 48);

        const sx = 84 / space.w;
        const sy = 48 / space.h;

        ctx.fillStyle = ink;
        // Escenario desplazándose según nivel (estrellas en nivel 1, terreno planetario en pares, cuevas en nivel 3+)
        if (space.stage % 3 === 1) {
          for (let i = 0; i < 8; i++) {
            const starX = (84 - ((space.tick * (1 + (i % 2)) + i * 17) % 84));
            const starY = (i * 7 + 3) % 44;
            ctx.fillRect(Math.floor(starX), starY, 1, 1);
          }
        } else {
          for (let x = 0; x < 84; x++) {
            const h = 3 + Math.floor(Math.sin((x + space.tick) * 0.18) * 2.5 + 2);
            ctx.fillRect(x, 48 - h, 1, h);
            if (space.stage % 3 === 0) {
              const th = 2 + Math.floor(Math.cos((x + space.tick) * 0.15) * 2 + 1.5);
              ctx.fillRect(x, 0, 1, th);
            }
          }
        }

        // Nave jugador (sprite Nokia 3310 10x7)
        if (space.player.invul % 4 < 2) {
          drawBitmap(ctx, SI_PLAYER, space.player.x * sx, space.player.y * sy, ink);
        }

        // Balas jugador (láser y misiles especiales)
        space.bullets.forEach((b) => {
          ctx.fillStyle = ink;
          if (b.special) {
            ctx.fillRect(Math.floor(b.x * sx), Math.floor(b.y * sy), 5, 2);
          } else {
            ctx.fillRect(Math.floor(b.x * sx), Math.floor(b.y * sy), 3, 1);
          }
        });

        // Balas enemigas
        space.ebullets.forEach((b) => {
          ctx.fillStyle = ink;
          ctx.fillRect(Math.floor(b.x * sx), Math.floor(b.y * sy), 2, 2);
        });

        // Enemigos con sprites clásicos distintos
        space.enemies.forEach((e) => {
          const spr = e.type === "sine" ? SI_ENEMY_JELLY : (e.type === "shooter" ? SI_ENEMY_SHOOTER : SI_ENEMY_FIGHTER);
          drawBitmap(ctx, spr, e.x * sx, e.y * sy, ink);
        });

        // Jefe pixel-art 14x12 con barra de vida
        if (space.boss) {
          drawBitmap(ctx, SI_BOSS, space.boss.x * sx, space.boss.y * sy, ink);
          const pct = Math.max(0, space.boss.hp / space.boss.maxHp);
          ctx.fillStyle = ink;
          ctx.fillRect(22, 1, Math.floor(40 * pct), 2);
        }

        // Pickups pixel-art
        space.pickups.forEach((p) => {
          drawBitmap(ctx, SI_PICKUP, p.x * sx, p.y * sy, ink);
        });
      }

      /* =====================================================================
         JUEGO 3: BANTUMI (CLÁSICO NOKIA 3310)
      ===================================================================== */
      const bantumi = {
        pits: [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0], // 0-5 jugador, 6 banco jugador, 7-12 CPU, 13 banco CPU
        cursor: 0,
        turn: "player",
        msg: "Tu turno",
        over: false
      };

      function startBantumi() {
        stopAllGames();
        bantumi.pits = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
        bantumi.cursor = 0;
        bantumi.turn = "player";
        bantumi.msg = "Tu turno";
        bantumi.over = false;
        state.view = "bantumi";
        render();
      }

      function sowBantumi(idx, isPlayer) {
        let seeds = bantumi.pits[idx];
        if (seeds <= 0) return false;
        bantumi.pits[idx] = 0;
        let cur = idx;
        while (seeds > 0) {
          cur = (cur + 1) % 14;
          if (isPlayer && cur === 13) continue;
          if (!isPlayer && cur === 6) continue;
          bantumi.pits[cur]++;
          seeds--;
        }
        // Captura si cae en hoyo propio vacío
        if (isPlayer && cur >= 0 && cur <= 5 && bantumi.pits[cur] === 1) {
          const opp = 12 - cur;
          if (bantumi.pits[opp] > 0) {
            bantumi.pits[6] += bantumi.pits[opp] + 1;
            bantumi.pits[opp] = 0;
            bantumi.pits[cur] = 0;
            playRetroSfx("bonus");
          }
        }
        // Revisar fin de partida
        const pSum = bantumi.pits.slice(0, 6).reduce((a, b) => a + b, 0);
        const cSum = bantumi.pits.slice(7, 13).reduce((a, b) => a + b, 0);
        if (pSum === 0 || cSum === 0) {
          bantumi.pits[6] += pSum;
          bantumi.pits[13] += cSum;
          for (let i = 0; i < 6; i++) { bantumi.pits[i] = 0; bantumi.pits[7 + i] = 0; }
          bantumi.over = true;
          bantumi.msg = bantumi.pits[6] >= bantumi.pits[13] ? "¡Ganaste!" : "Ganó CPU";
          playRetroSfx("bonus");
          render();
          return true;
        }
        const extraTurn = (isPlayer && cur === 6) || (!isPlayer && cur === 13);
        if (!extraTurn) {
          bantumi.turn = isPlayer ? "cpu" : "player";
          bantumi.msg = bantumi.turn === "player" ? "Tu turno" : "Turno CPU...";
        } else {
          bantumi.msg = isPlayer ? "¡Turno extra!" : "CPU repite";
        }
        render();
        if (bantumi.turn === "cpu" && !bantumi.over) {
          setTimeout(cpuBantumiTurn, 650);
        }
        return true;
      }

      function cpuBantumiTurn() {
        if (state.view !== "bantumi" || bantumi.over || bantumi.turn !== "cpu") return;
        const choices = [];
        for (let i = 7; i <= 12; i++) if (bantumi.pits[i] > 0) choices.push(i);
        if (choices.length === 0) return;
        const pick = choices[Math.floor(Math.random() * choices.length)];
        playSoftkeySound(780);
        sowBantumi(pick, false);
      }

      /* =====================================================================
         NAVEGACIÓN GENERAL Y RENDER
      ===================================================================== */
      function stopCall() {
        if (state.callTimer) { clearInterval(state.callTimer); state.callTimer = null; }
        state.callSeconds = 0;
      }

      function goHome(animateMenuExit = false) {
        stopAllGames();
        stopCall();
        if (animateMenuExit && state.view === "menu" && !state.menuClosing) {
          const overlay = document.getElementById("menuOverlay");
          if (overlay) {
            state.menuClosing = true;
            const bgHome = lcdBody.querySelector(".home-view");
            if (bgHome) bgHome.classList.remove("dimmed");
            overlay.classList.remove("entering");
            overlay.classList.add("closing");
            setTimeout(() => {
              state.menuClosing = false;
              state.view = "home";
              state.dialNumber = "";
              render();
            }, 360);
            return;
          }
        }
        state.menuClosing = false;
        state.view = "home";
        state.dialNumber = "";
        render();
      }

      window.onAndroidBack = function () {
        if (state.view === "menu") goHome(true);
        else if (state.view === "snake" || state.view === "snakeLevel" || state.view === "snakeMaze") { stopAllGames(); state.view = "snakeMenu"; render(); }
        else if (state.view === "snakeMenu" || state.view === "spaceImpact" || state.view === "bantumi") { stopAllGames(); state.view = "games"; render(); }
        else if (state.view !== "home") goHome(false);
      };

      window.onAndroidResume = function () {
        loadRealAndroidApps();
        if (state.view === "home") render();
      };

      function openApp(appId) {
        stopAllGames();
        if (appId === "games") { state.view = "games"; state.gamesIndex = 0; render(); return; }
        if (appId === "snakeMenu") { state.view = "snakeMenu"; state.snakeMenuIndex = 0; render(); return; }
        if (appId === "spaceImpact") { startSpaceImpact(); return; }
        if (appId === "bantumi") { startBantumi(); return; }
        if (appId === "settings" || appId === "customize") { state.view = "customize"; state.customizeIndex = 0; render(); return; }
        if (appId === "calc") {
          state.view = "calc"; state.calcValue = "0"; state.calcPrev = null; state.calcOp = null; state.calcReset = false;
          render(); return;
        }
        if (window.AndroidLauncher) {
          if (appId === "camera") { window.AndroidLauncher.openCamera(); return; }
          if (appId === "browser") { window.AndroidLauncher.openBrowser(); return; }
          const realList = getActiveAppList();
          const realApp = realList.find((a) => a.pkg === appId || a.id === appId);
          if (realApp && realApp.pkg) { window.AndroidLauncher.launchApp(realApp.pkg); return; }
        }
        const allApps = getActiveAppList();
        const found = allApps.find((a) => a.id === appId) || { id: appId, name: appId, emoji: "📱", bg: "#2563eb" };
        state.activeApp = found;
        state.view = "appPreview";
        render();
      }

      function handleCalcDigit(d) {
        if (d === "*" || d === "#") return;
        if (state.calcReset || state.calcValue === "0") { state.calcValue = d; state.calcReset = false; }
        else if (state.calcValue.length < 10) state.calcValue += d;
        render();
      }

      function handleCalcOp(op) {
        const current = parseFloat(state.calcValue) || 0;
        if (op === "C") { state.calcValue = "0"; state.calcPrev = null; state.calcOp = null; state.calcReset = false; render(); return; }
        if (op === "=") {
          if (state.calcPrev !== null && state.calcOp) {
            let res = current;
            if (state.calcOp === "+") res = state.calcPrev + current;
            if (state.calcOp === "-") res = state.calcPrev - current;
            if (state.calcOp === "×") res = state.calcPrev * current;
            if (state.calcOp === "÷") res = current === 0 ? 0 : state.calcPrev / current;
            state.calcValue = String(Number(res.toFixed(4)));
            state.calcPrev = null; state.calcOp = null; state.calcReset = true;
          }
          render(); return;
        }
        state.calcPrev = current; state.calcOp = op; state.calcReset = true; render();
      }

      function getCustomizeRows() {
        return [
          { id: "body", label: "Color del teléfono", value: BODY_THEMES[state.bodyIdx].name },
          { id: "lcd", label: "Tema de pantalla", value: LCD_THEMES[state.lcdIdx].name },
          { id: "sound", label: "Sonido de teclas", value: state.soundOn ? "Sí" : "No" },
          { id: "clock", label: "Formato de hora", value: state.use24h ? "24h" : "12h am/pm" }
        ];

      function toggleCustomizeRow(idx) {
        const row = getCustomizeRows()[idx];
        if (!row) return;
        if (row.id === "body") state.bodyIdx = (state.bodyIdx + 1) % BODY_THEMES.length;
        else if (row.id === "lcd") state.lcdIdx = (state.lcdIdx + 1) % LCD_THEMES.length;
        else if (row.id === "sound") state.soundOn = !state.soundOn;
        else if (row.id === "clock") state.use24h = !state.use24h;
        savePrefs(); applyThemes(); render();
      }

        if (state.view === "menu") {

          const enterClass = state.menuAnimateIn ? "entering" : "";

          lcdBody.innerHTML = `
            <div class="home-view dimmed">
              <div class="home-date">${formatDate()}</div>

                <div class="home-line"></div>
                <div class="home-clock-ribbon">${formatClockDisplay()}</div>
              </div>

            <div class="menu-overlay ${enterClass}" id="menuOverlay">
              <div class="menu-scroll" id="menuScroll">
                ${tilesHtml}
              </div>

          lcdBody.querySelectorAll("[data-app-idx]").forEach((el) => {

              state.menuIndex = idx;
              playSoftkeySound(933);
              openApp(allApps[idx].id);
            });

          const sel = lcdBody.querySelector(".app-tile.selected");
          if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest", behavior: "smooth" });

        if (state.view === "calc") {
          setSoftkeys("Limpiar", "=", "Atrás", false);

            <div class="mini-app-view">
              <div class="list-header" style="padding-bottom:2px;">Calculadora</div>
              <div class="calc-display">${state.calcOp ? `${state.calcPrev} ${state.calcOp} ` : ""}${state.calcValue}</div>
              <div class="calc-ops">
                <button class="lcd-mini-btn" data-op="+">+</button>
                <button class="lcd-mini-btn" data-op="-">-</button>
                <button class="lcd-mini-btn" data-op="×">×</button>
                <button class="lcd-mini-btn" data-op="÷">÷</button>
              </div>
            </div>
          `;
          lcdBody.querySelectorAll("[data-op]").forEach((btn) => {
            btn.addEventListener("click", () => { playSoftkeySound(933); handleCalcOp(btn.getAttribute("data-op")); });
          });
          return;
        }

        if (state.view === "appPreview" && state.activeApp) {
          setSoftkeys("Inicio", "", "Atrás", false);
          lcdBody.innerHTML = `
            <div class="calling-view">
              <div style="font-size:30px;">${state.activeApp.emoji}</div>
              <div style="font-size:15px;font-weight:800;">${state.activeApp.name}</div>
              <div style="font-size:11px;font-weight:600;opacity:0.85;max-width:210px;line-height:1.4;">En el APK de Android, esto abre directamente ${state.activeApp.name} instalado en tu celular.</div>
            </div>
          `;
        }
      }

      function activateGotoItem() {
        const item = GOTO_ITEMS[state.gotoIndex];
        if (!item) return;
        playSoftkeySound(933);
        if (item.id === "exit") {
          if (window.AndroidLauncher && typeof window.AndroidLauncher.openHomeSettings === "function") {
            window.AndroidLauncher.openHomeSettings();
            return;
          }
          showToast("Salir del Launcher (vuelve a tu inicio Android)");
          goHome();
          return;
        }
        openApp(item.id);
      }

      function activateSnakeMenuItem() {
        playSoftkeySound(933);
        if (state.snakeMenuIndex === 0) startSnakeGame();
        else if (state.snakeMenuIndex === 1) { state.view = "snakeLevel"; render(); }
        else if (state.snakeMenuIndex === 2) { state.view = "snakeMaze"; render(); }
        else showToast("Récord Snake II: " + state.snakeHigh);
      }

      function startCall() {
        if (window.AndroidLauncher && typeof window.AndroidLauncher.dialNumber === "function" && state.dialNumber) {
          window.AndroidLauncher.dialNumber(state.dialNumber);
          return;
        }
        stopCall();
        state.view = "calling";
        state.callSeconds = 0;
        playSoftkeySound(933);
        render();
        state.callTimer = setInterval(() => {
          state.callSeconds++;
          if (state.view === "calling") render();
        }, 1000);
      }

      function handleAction(action) {
        vibrate();
        if (action === "end") {
          playSoftkeySound(933);
          goHome(true);
          return;
        }

        if (action === "call") {
          playSoftkeySound(933);
          if (state.view === "dialer" && state.dialNumber.length > 0) startCall();
          else if (state.view === "home") { state.dialNumber = "523"; startCall(); }
          return;
        }

        if (action === "soft-left") {
          playSoftkeySound(933);
          if (state.view === "home") { state.view = "goto"; state.gotoIndex = 0; render(); }
          else if (state.view === "goto") activateGotoItem();
          else if (state.view === "games") openApp(GAMES_LIST[state.gamesIndex].id);
          else if (state.view === "snakeMenu") activateSnakeMenuItem();
          else if (state.view === "snakeLevel" || state.view === "snakeMaze") { savePrefs(); state.view = "snakeMenu"; render(); }
          else if (state.view === "customize") toggleCustomizeRow(state.customizeIndex);
          else if (state.view === "snake") {
            if (snake.gameOver) startSnakeGame();
            else { snake.running = !snake.running; render(); }
          } else if (state.view === "spaceImpact") {
            if (space.gameOver) startSpaceImpact();
            else spaceSpecial();
          } else if (state.view === "bantumi") {
            if (bantumi.over) startBantumi();
            else if (bantumi.turn === "player") sowBantumi(bantumi.cursor, true);
          } else if (state.view === "calc") handleCalcOp("C");
          else if (state.view === "appPreview") goHome();
          else if (state.view === "calling") showToast("Altavoz activado");
          return;
        }

        if (action === "soft-right") {
          playSoftkeySound(933);
          if (state.view === "home") { state.view = "customize"; state.customizeIndex = 0; render(); }
          else if (state.view === "dialer") {
            state.dialNumber = state.dialNumber.slice(0, -1);
            if (!state.dialNumber) state.view = "home";
            render();
          } else if (state.view === "snake" || state.view === "snakeLevel" || state.view === "snakeMaze") {
            stopAllGames(); state.view = "snakeMenu"; render();
          } else if (state.view === "snakeMenu" || state.view === "spaceImpact" || state.view === "bantumi") {
            stopAllGames(); state.view = "games"; render();
          } else if (state.view === "games") {
            state.view = "goto"; render();
          } else if (state.view === "appPreview" || state.view === "calc") {
            state.view = "menu"; render();
          } else {
            goHome(true);
          }
          return;
        }

        if (action === "ok") {
          if (state.view === "home") {
            // Sonido de gota de agua exacto al abrir el Menú
            playMenuDropSound();
            state.view = "menu";
            state.menuIndex = 0;
            state.menuAnimateIn = true;
            render();
            return;
          }
          playSoftkeySound(933);
          if (state.view === "dialer") showToast("Guardado: " + state.dialNumber);
          else if (state.view === "goto") activateGotoItem();
          else if (state.view === "games") openApp(GAMES_LIST[state.gamesIndex].id);
          else if (state.view === "snakeMenu") activateSnakeMenuItem();
          else if (state.view === "snakeLevel" || state.view === "snakeMaze") { savePrefs(); state.view = "snakeMenu"; render(); }
          else if (state.view === "menu") {
            const list = getActiveAppList();
            if (list[state.menuIndex]) openApp(list[state.menuIndex].id);
          } else if (state.view === "customize") toggleCustomizeRow(state.customizeIndex);
          else if (state.view === "snake") {
            if (snake.gameOver) startSnakeGame();
            else { snake.running = !snake.running; render(); }
          } else if (state.view === "spaceImpact") {
            if (space.gameOver) startSpaceImpact();
            else spaceShoot();
          } else if (state.view === "bantumi") {
            if (bantumi.over) startBantumi();
            else if (bantumi.turn === "player") sowBantumi(bantumi.cursor, true);
          } else if (state.view === "calc") handleCalcOp("=");
          return;
        }

        if (["up", "down", "left", "right"].includes(action)) {
          if (state.view !== "snake" && state.view !== "spaceImpact") playSoftkeySound(933);

          if (state.view === "home") {
            if (action === "up") openApp("camera");
            if (action === "down") { playMenuDropSound(); state.view = "menu"; state.menuAnimateIn = true; render(); }
            if (action === "left") openApp("games");
            if (action === "right") { state.view = "customize"; render(); }
            return;
          }
          if (state.view === "goto") {
            if (action === "up") state.gotoIndex = (state.gotoIndex - 1 + GOTO_ITEMS.length) % GOTO_ITEMS.length;
            if (action === "down") state.gotoIndex = (state.gotoIndex + 1) % GOTO_ITEMS.length;
            render(); return;
          }
          if (state.view === "games") {
            if (action === "up") state.gamesIndex = (state.gamesIndex - 1 + GAMES_LIST.length) % GAMES_LIST.length;
            if (action === "down") state.gamesIndex = (state.gamesIndex + 1) % GAMES_LIST.length;
            render(); return;
          }
          if (state.view === "snakeMenu") {
            if (action === "up") state.snakeMenuIndex = (state.snakeMenuIndex - 1 + 4) % 4;
            if (action === "down") state.snakeMenuIndex = (state.snakeMenuIndex + 1) % 4;
            render(); return;
          }
          if (state.view === "snakeLevel") {
            if (action === "right" || action === "up") state.snakeLevel = Math.min(9, state.snakeLevel + 1);
            if (action === "left" || action === "down") state.snakeLevel = Math.max(1, state.snakeLevel - 1);
            savePrefs(); render(); return;
          }
          if (state.view === "snakeMaze") {
            if (action === "up") state.snakeMazeIdx = (state.snakeMazeIdx - 1 + SNAKE_MAZES.length) % SNAKE_MAZES.length;
            if (action === "down") state.snakeMazeIdx = (state.snakeMazeIdx + 1) % SNAKE_MAZES.length;
            savePrefs(); render(); return;
          }
          if (state.view === "customize") {
            const len = getCustomizeRows().length;
            if (action === "up") state.customizeIndex = (state.customizeIndex - 1 + len) % len;
            if (action === "down") state.customizeIndex = (state.customizeIndex + 1) % len;
            if (action === "left" || action === "right") toggleCustomizeRow(state.customizeIndex);
            else render();
            return;
          }
          if (state.view === "menu") {
            const total = getActiveAppList().length;
            if (action === "right") state.menuIndex = (state.menuIndex + 1) % total;
            else if (action === "left") state.menuIndex = (state.menuIndex - 1 + total) % total;
            else if (action === "down") state.menuIndex = (state.menuIndex + 4) % total;
            else if (action === "up") state.menuIndex = (state.menuIndex - 4 + total) % total;
            render(); return;
          }
          if (state.view === "bantumi" && bantumi.turn === "player" && !bantumi.over) {
            if (action === "right") bantumi.cursor = (bantumi.cursor + 1) % 6;
            if (action === "left") bantumi.cursor = (bantumi.cursor + 5) % 6;
            render(); return;
          }
          if (state.view === "snake" && snake.running) {
            if (action === "up") queueSnakeDir(0, -1);
            if (action === "down") queueSnakeDir(0, 1);
            if (action === "left") queueSnakeDir(-1, 0);
            if (action === "right") queueSnakeDir(1, 0);
            return;
          }
          if (state.view === "spaceImpact" && space.running) {
            if (action === "up") space.player.y = Math.max(2, space.player.y - 7);
            if (action === "down") space.player.y = Math.min(space.h - 9, space.player.y + 7);
            if (action === "left") space.player.x = Math.max(2, space.player.x - 7);
            if (action === "right") space.player.x = Math.min(space.w * 0.45, space.player.x + 7);
            drawSpace();
          }
        }
      }

      function handleDigit(digit) {
        vibrate();
        if (state.view === "snake" && snake.running) {
          if (digit === "2") queueSnakeDir(0, -1);
          if (digit === "8") queueSnakeDir(0, 1);
          if (digit === "4") queueSnakeDir(-1, 0);
          if (digit === "6") queueSnakeDir(1, 0);
          return;
        }
        if (state.view === "spaceImpact" && space.running) {
          if (digit === "2") space.player.y = Math.max(2, space.player.y - 7);
          if (digit === "8") space.player.y = Math.min(space.h - 9, space.player.y + 7);
          if (digit === "4") space.player.x = Math.max(2, space.player.x - 7);
          if (digit === "6") space.player.x = Math.min(space.w * 0.45, space.player.x + 7);
          if (digit === "5") spaceShoot();
          if (digit === "*") spaceSpecial();
          drawSpace();
          return;
        }
        playDtmfSound(digit);
        if (state.view === "calc") { handleCalcDigit(digit); return; }
        if (state.view === "home" || state.view === "dialer") {
          if (state.dialNumber.length < 18) {
            state.dialNumber += digit;
            state.view = "dialer";
            render();
          }
        }
      }

      document.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => handleAction(btn.getAttribute("data-action")));
      });

      document.querySelectorAll("[data-digit]").forEach((btn) => {
        btn.addEventListener("click", () => handleDigit(btn.getAttribute("data-digit")));
      });

      softLeftLabel.addEventListener("click", () => handleAction("soft-left"));
      softCenterLabel.addEventListener("click", () => handleAction("ok"));
      softRightLabel.addEventListener("click", () => handleAction("soft-right"));

      window.addEventListener("keydown", (e) => {
        if (e.key >= "0" && e.key <= "9") handleDigit(e.key);
        else if (e.key === "*" || e.key === "#") handleDigit(e.key);
        else if (e.key === "ArrowUp") { e.preventDefault(); handleAction("up"); }
        else if (e.key === "ArrowDown") { e.preventDefault(); handleAction("down"); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); handleAction("left"); }
        else if (e.key === "ArrowRight") { e.preventDefault(); handleAction("right"); }
        else if (e.key === "Enter") { e.preventDefault(); handleAction("ok"); }
        else if (e.key === "Backspace") { e.preventDefault(); handleAction("soft-right"); }
        else if (e.key === "Escape") { e.preventDefault(); handleAction("end"); }
      });

      window.addEventListener("resize", () => {
        if (state.view === "snake") drawSnake();
        if (state.view === "spaceImpact") drawSpace();
      });

      setInterval(() => {
        if (state.view === "home") render();
      }, 15000);

      window.addEventListener("pointerdown", ensureAudio, { passive: true });
      loadRealAndroidApps();
      applyThemes();
      render();
    })();
  </script>
</body>
</html>
